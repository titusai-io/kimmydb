# KimmyDB configuration.
#
# Every value here is optional — this file shows the defaults. Any setting can
# also be given as a CLI flag or a KIMMY_* environment variable, which take
# precedence over this file. Run `kimmyd check-config` to see what a given
# combination actually resolves to.

[server]
# Address for HTTP, WebSocket change streams, and the MCP endpoint.
bind = "0.0.0.0:7878"

# Serve the MCP endpoint at /mcp, for AI agents.
#
# Every MCP tool call runs as the authenticated principal, through the same
# authorization check as the REST routes — a read-only token calling a write
# tool is denied. Turning this off removes surface area; it does not remove a
# privilege, because MCP never had one of its own.
mcp = true

# Host header values /mcp will accept. Empty accepts any.
#
# DNS-rebinding protection, off by default because /mcp requires a bearer token
# that a rebinding attack cannot forge. If you set it, list every name clients
# actually connect by — anything else is refused.
mcp_allowed_hosts = []

[storage]
# Holds the redb database file and the persistent node identity. Back this up,
# and never share it between two running nodes.
data_dir = "/var/lib/kimmy"

# How long deleted documents are kept as tombstones before collection.
#
# This must exceed the longest network partition you are willing to tolerate.
# If a partitioned peer rejoins after tombstones have been collected here, the
# documents it deleted will come back from the dead.
tombstone_retention_secs = 86400

# How much oplog history to retain, which bounds two things: how long a
# disconnected change-stream client can be away and still resume, and how far
# behind a peer can fall and still catch up incrementally.
oplog_retention_secs = 86400

[auth]
# Run with no authentication at all. Only permitted when `server.bind` is a
# loopback address; the server refuses to start otherwise.
insecure_no_auth = false

# Bootstrap superuser. Created on first start only — changing it later has no
# effect on an existing database.
root_user = "root"

# Prefer KIMMY_ROOT_PASSWORD over writing this down.
# root_password = "change-me"

# Signing key for JWTs. In a cluster every node must use the *same* value, or a
# token issued by one node will be rejected by the next node a request reaches.
# jwt_secret = "generate-me-with-openssl-rand-base64-32"

token_ttl_secs = 3600

[cluster]
# KimmyDB is leaderless: there is no primary, no election, and no quorum. Nodes
# gossip membership and pull oplog entries they are missing. Writes are
# accepted anywhere and converge by last-writer-wins.
enabled = false

# Gossip transport bind address (UDP for SWIM, TCP for oplog transfer).
bind = "0.0.0.0:7900"

# Where to look for peers, re-resolved periodically so new pods are picked up
# without a restart. Accepted forms:
#
#   "k8s:kimmy-headless.default.svc.cluster.local"  headless Service, one A record per pod
#   "dns:seeds.kimmy.internal"                      A/AAAA records
#   "dns-srv:_kimmy._udp.example.com"               SRV records, ports included
#   "static:10.0.0.1:7900,10.0.0.2:7900"            explicit list
#   "10.0.0.1:7900"                                 shorthand for a single static peer
seeds = []

# Shared secret authenticating node-to-node traffic. Required when clustering:
# without it any host that can reach the gossip port could inject writes.
# cluster_secret = "generate-me-with-openssl-rand-base64-32"

[log]
# A tracing-subscriber filter directive. RUST_LOG overrides this when set.
level = "info"

# "pretty" for a terminal, "json" for a log shipper.
format = "pretty"
