# KimmyDB configuration.
#
# Every value here is optional — this file shows the defaults. Any setting can
# also be given as a CLI flag or a KIMMY_* environment variable, which take
# precedence over this file. Run `kimmyd check-config` to see what a given
# combination actually resolves to.

[server]
# Address for HTTP, WebSocket change streams, and the MCP endpoint.
bind = "0.0.0.0:7878"

# The URL clients should use to reach *this* node.
#
# Published to the cluster so `/v1/topology` can hand it to clients that want to
# fail over. It cannot be inferred: a node bound to 0.0.0.0 has no single
# address, and the address clients actually reach may belong to a proxy, a load
# balancer or a Kubernetes service rather than to this process. A wrong guess
# would be published to every client in the cluster, so a node with a wildcard
# bind and no value here advertises nothing and says so at startup.
#
# With a concrete bind this defaults to that address, with the scheme following
# whether this node terminates TLS.
# advertise = "https://db-1.internal:7878"

# Serve the MCP endpoint at /mcp, for AI agents.
#
# Every MCP tool call runs as the authenticated principal, through the same
# authorization check as the REST routes — a read-only token calling a write
# tool is denied. Turning this off removes surface area; it does not remove a
# privilege, because MCP never had one of its own.
mcp = true

# Host header values /mcp will accept. Empty accepts any.
#
# DNS-rebinding protection, off by default because /mcp requires a bearer token
# that a rebinding attack cannot forge. If you set it, list every name clients
# actually connect by — anything else is refused.
mcp_allowed_hosts = []

# How long a request may spend *waiting* before this node abandons it with
# 503 `timeout`, in seconds. 0 is refused.
#
# A request waits in two places: while its body is still arriving, and while an
# embedding provider is being asked. Both are where an authenticated caller can
# hold a connection open at no cost to itself, and both are what this bounds.
# It does not cut short storage work already running — a scan, a bulk commit or
# an index backfill completes and is answered with its result however long it
# took — so this is not a query timeout, and raising it is about slow clients
# and slow providers. Change-stream upgrades and /mcp carry no deadline.
request_timeout_secs = 30

# Largest request body the API will read, in bytes. Over it, 413
# `payload_too_large`. 0 is refused.
#
# 2 MiB is the ceiling every release has enforced; it is a setting now so it can
# be lowered for a deployment of small documents or raised for a bulk-import
# pattern. Applies to every REST route, login included. /mcp reads its bodies
# under rmcp's own 4 MiB limit.
max_body_bytes = 2097152

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
#
# Native termination for HTTP, WebSocket and MCP — one listener, one port. There
# is no on/off switch: TLS is on when both of these are set, and setting exactly
# one is refused at startup, because starting anyway would serve plaintext on a
# port you believe is encrypted.
#
# Both files are read before the socket is bound, so a missing or unusable
# certificate stops the node instead of failing for whoever connects first.
#
# Commented out below, which means plaintext. A non-loopback bind without TLS
# warns once at startup — terminating at a proxy is a fine deployment, but
# nothing about a working request would tell you the token crossed the wire in
# the clear.
[server.tls]

# PEM certificate chain, leaf first, then any intermediates. A client that
# cannot build a path to a root it trusts refuses the connection even when the
# leaf itself is valid.
# cert_file = "/etc/kimmy/tls/server.crt"

# PEM private key: PKCS#8, PKCS#1 or SEC1.
# key_file = "/etc/kimmy/tls/server.key"

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------
#
# /v1/auth/login is limited by default. That is the one route where a limit is
# a security control rather than a capacity control: it is unauthenticated by
# necessity, and every attempt runs a full Argon2id verification — including for
# a user that does not exist, which is what stops timing from revealing whether
# one does. Unthrottled, it lets an anonymous caller spend ~19 MB and
# milliseconds of CPU per request.
#
# The limit is checked before the password is verified, and only *failed*
# attempts are recorded — a client with correct credentials is never throttled
# for succeeding.
#
# The authenticated routes have a limit of their own, per_principal below. It is
# off by default: a capacity number wants a measurement behind it, and you are
# the one holding the measurement.
[server.rate_limit]

# Failed logins allowed per client address, per window. Set to 0 to disable.
#
# Callers behind one NAT share a bucket, and an address over its budget is
# refused even with the right password. Raise this on a shared egress, or set
# trusted_proxy_header below.
login_per_ip = 10
login_per_ip_window_secs = 60

# Failed logins allowed per attempted username, across every address. 0 disables
# it, and 0 is the default.
#
# It is the only defence against a guess spread over many source addresses,
# which per-address limiting cannot see. It also lets anyone who can reach the
# endpoint spend a named user's budget and keep the real holder locked out for
# the window. That trade depends on your deployment, so it is opt-in.
login_per_user = 0
login_per_user_window_secs = 300

# Header naming the real client, when this server sits behind a proxy.
# Commented out, meaning the socket peer address is used.
#
# Only set this if a proxy you control rewrites the header. It is client-
# supplied data otherwise, and trusting it would let any caller get a fresh
# budget per request by varying a header — worse than no limiter, because it
# would look like one was working. The *last* value is used, since a proxy
# appends the peer it saw.
# trusted_proxy_header = "X-Forwarded-For"

# Upper bound on distinct keys held in memory.
#
# The key space is attacker-controlled — an address is whatever packets arrive
# from — so this is what stops the defence becoming a denial of service itself.
# Buckets that have refilled are forgotten first. Shared by every limiter in
# this section, per_principal included.
max_tracked_keys = 100000

# Requests allowed per authenticated principal, per window, on every route that
# takes a token — REST, /mcp and change-stream upgrades alike. 0 disables it,
# and 0 is the default.
#
# Keyed on who the caller is rather than where the request came from: a local
# user by name, a federated identity by issuer and subject. A principal spread
# across many addresses draws on one budget; two principals behind one NAT do
# not share one. Checked after the token is verified, so a bad token is a 401
# and spends nothing. Over the limit: 429 with Retry-After, counted in
# kimmy_rate_limited_principal_total.
#
# A starting point, if you want one before measuring: 3000 over 60 seconds is
# fifty requests a second sustained per principal — well above what one
# well-behaved client produces, and comfortably below what a node serves.
per_principal = 0
per_principal_window_secs = 60

# ---------------------------------------------------------------------------
# Audit log
# ---------------------------------------------------------------------------
#
# A structured record of authorization decisions -- who was allowed or refused
# what. Emitted from the single point every check funnels through, so a new
# route is audited by virtue of being authorized at all.
#
# Records go to the `kimmy::audit` tracing target, so they can be routed
# separately, e.g. KIMMY_LOG_LEVEL='warn,kimmy::audit=info'.
[audit]

# off      -- nothing
# denials  -- refusals only (the default)
# writes   -- refusals, plus anything that wrote or administered
# all      -- every decision, including reads
#
# `all` writes one line per authorized operation, which on a read-heavy node is
# one per request. A denial is rare and is the event worth watching for, which
# is why `denials` is the default. An unknown value is refused at startup: a
# typo would otherwise produce a server that records nothing, and that looks
# exactly like a server nobody has attacked.
mode = "denials"

[storage]
# Holds the redb database file and the persistent node identity. Back this up,
# and never share it between two running nodes.
data_dir = "/var/lib/kimmy"

# How long deleted documents are kept as tombstones before collection.
#
# This must exceed the longest network partition you are willing to tolerate.
# If a partitioned peer rejoins after tombstones have been collected here, the
# documents it deleted will come back from the dead.
tombstone_retention_secs = 86400

# How much oplog history to retain, which bounds two things: how long a
# disconnected change-stream client can be away and still resume, and how far
# behind a peer can fall and still catch up incrementally.
oplog_retention_secs = 86400
# Bound on the storage engine's page cache — most of the node's resident
# memory. redb fills it and evicts only for room, never on a timer, so a node
# sits at whatever its busiest period filled. 256 MiB by default; raise it on a
# node whose database file is much larger and whose reads are latency-bound.
cache_bytes = 268435456

# How often to collect records past the two windows above.
#
# Retention says what is garbage; this says how often to look. It must not
# exceed oplog_retention_secs, or records outlive their window by up to a whole
# interval and the retention number stops meaning what it says.
#
# Set to 0 to disable collection entirely — the oplog and tombstones then grow
# without bound, which is occasionally what you want while debugging a
# replication problem, and never what you want in production.
gc_interval_secs = 600

# How many documents a `multi: true` update or delete commits per transaction.
#
# The single writer is released between chunks, so this bounds how long one
# request can hold it, and a crash or a refusal loses at most the chunk in
# flight — the oplog reflects exactly what landed. Larger amortises the
# per-commit fsync over more documents; smaller lets other writers in sooner.
# Must be between 1 and 10,000.
multi_chunk_docs = 1000

# How a commit becomes durable.
#
#   "durable"   — every commit fsyncs before it returns. The default.
#   "coalesced" — a commit is written without its own fsync and waits for the
#                 next shared fsync, one per commit_coalesce_ms window, so N
#                 concurrent writers pay one fsync rather than N. Still durable
#                 when the response returns; the cost is up to one window of
#                 latency per write.
#
# There is deliberately no class under which an acknowledged write can be
# lost. Single-writer loops gain nothing from "coalesced" (they wait a window
# for company that never comes); it pays off under concurrency.
durability = "durable"
commit_coalesce_ms = 5

[auth]
# Run with no authentication at all. Only permitted when `server.bind` is a
# loopback address; the server refuses to start otherwise.
insecure_no_auth = false

# Bootstrap superuser. Created on first start only — changing it later has no
# effect on an existing database.
root_user = "root"

# Prefer KIMMY_ROOT_PASSWORD over writing this down.
#
# The value below, like every placeholder in this repository's examples and
# compose file (`changeme`, `hunter2`, `password`, ...), is refused when the
# node listens on anything other than a loopback address: a value every reader
# of the repository holds is not a secret. See docs/security.md and ADR-093.
# root_password = "change-me"

# Signing key for JWTs. **Required whenever authentication is on** — a single
# node too, not just a cluster: without one the server would sign tokens with a
# constant compiled into the binary, so anyone could forge one. It refuses to
# start instead. 32 bytes minimum (the HS256 key floor of RFC 7518 §3.2; it was
# 16 up to 0.16.x). In a cluster every node must use the *same* value, or a
# token issued by one node will be rejected by the next node a request reaches.
# Prefer KIMMY_JWT_SECRET over writing this down, which is why it stays
# commented here — `check-config` on this file needs both it and
# KIMMY_ROOT_PASSWORD in the environment. The placeholder below is refused off
# loopback, as above.
# jwt_secret = "generate-me-with-openssl-rand-base64-32"

# The signing key being retired, during a rotation only. Tokens it signed are
# still accepted while it is set; new tokens are signed with `jwt_secret` alone.
# To rotate: move the old value here, put the new one in `jwt_secret`, roll
# every node, wait one `token_ttl_secs`, then remove this and roll again. Same
# length floor as `jwt_secret`, and it must differ from it. Prefer
# KIMMY_JWT_PREVIOUS_SECRET over writing it down, for the same reason as above.
# jwt_previous_secret = "the-value-jwt-secret-had-before-the-rotation"

token_ttl_secs = 3600

[auth.local]
# Where the password login route answers (ADR-100). Also KIMMY_LOCAL_LOGIN.
#
#   always        -- every caller. The default, and exactly what shipped.
#   loopback_only -- only a connection whose TCP peer address is loopback;
#                    anyone else gets 403 `forbidden`. This keeps the break-glass
#                    root reachable from the node's own host (SSH, a sidecar, a
#                    tunnel) and unreachable from the network an identity
#                    provider fronts.
#   disabled      -- the route answers 404. Refused at startup unless
#                    [auth.oidc] is configured, because a node with neither
#                    could authenticate nobody.
#
# It governs MINTING only. A local token already issued keeps verifying under
# every mode until it expires or is revoked, and federated tokens are
# untouched. /v1/auth/refresh follows the same rule, because it mints too.
#
# `loopback_only` judges the TCP peer and deliberately ignores
# server.rate_limit.trusted_proxy_header: a forwarded header is something the
# client writes. A reverse proxy or TLS terminator on the SAME HOST therefore
# makes every caller look local, and the mode restricts nothing — put the proxy
# elsewhere, or restrict the path at the proxy.
login = "always"

# ---------------------------------------------------------------------------
# Federating with an external OpenID Connect provider.
#
# Entirely optional, and additive: local users keep working exactly as they do
# without this. The node grows a *second* token verifier and picks between them
# by the issuer a token claims — a token is only ever offered to the verifier it
# says it belongs to, which is what leaves no algorithm-confusion surface
# between the two. See docs/security.md and ADR-064.
#
# The whole section is commented out because there is no sensible default for
# "which identity provider". Uncomment it and the node federates; leave it and
# nothing changes. A *half*-filled section is refused at startup rather than
# quietly ignored — a node that started with federation silently off would
# refuse every token the provider issued.
# ---------------------------------------------------------------------------
# [auth.oidc]

# The provider's issuer URL, matched against a token's `iss` exactly, and where
# discovery starts: {issuer}/.well-known/openid-configuration names the JWKS
# this node fetches signing keys from.
#
# Must be https. The signing keys come down this URL, so over plaintext anyone
# on the network path could substitute their own and mint any identity they
# liked — the node refuses to start rather than allow that.
#
# One issuer, not a list. A second one is a second trust root.
# issuer = "https://auth.example.com"

# The `aud` a token must carry to be accepted here. **Required.**
#
# A provider signs tokens for every application that trusts it. Without an
# audience restriction, a token minted for the company wiki would authenticate
# against this database.
#
# **Write it as the public https URL clients reach this node at, if you can.**
# There is deliberately no second setting for the resource identifier: an
# audience written as an https URL *is* one, and it turns on two things that
# only work when this node has a name an authorization server knows —
#
#   - RFC 9728 metadata at /.well-known/oauth-protected-resource, which is what
#     lets `kimmy login --oidc --url <this node>` work with nothing else set,
#     and what a conformant MCP client reads to find where to authenticate;
#   - a `resource_metadata` pointer on every 401, so a client that gets refused
#     can find out where to go.
#
# It also has to be registered with the provider — as a resource server it will
# issue tokens for, and on each client that may ask for one: the provider's
# list of resource servers plus the client registration's allowed resources.
# All three values must match byte for byte: `aud` is compared exactly.
#
# audience = "https://kimmydb.example.com"
#
# An opaque audience keeps working exactly as it always has — it simply
# publishes no metadata, and every token this node accepts carries whatever
# audience the provider defaults to, shared with every other resource that
# trusts it. Use one when the provider does not implement RFC 8707, or when it
# mints something that is not dereferenceable (Entra ID's `api://<guid>`, or a
# `urn:` value). Both are accepted; only `http://` is refused, because that is
# an https URL with the scheme mistyped.
# audience = "kimmydb"

# Which claim carries the caller's roles. "roles" for most providers,
# "groups" for Entra ID. Getting this wrong is quiet: every federated caller
# arrives with no grants at all, which looks exactly like a permissions problem.
# roles_claim = "roles"

# How often to re-fetch the provider's signing keys, in seconds. A rotation
# between two ticks is covered separately — a token naming an unknown key id
# triggers one rate-limited refetch — so this is about staying current rather
# than about how fast a rotation is survived.
# refresh_interval_secs = 300

# Refuse a token whose `typ` header is not `at+jwt` (RFC 9068 §4). The header
# exists so an ID token cannot be presented as an access token.
#
# Off by default, because providers disagree about stamping it: Entra ID sends
# `typ: JWT` on its v2 access tokens, so a strict default would refuse every
# token from a supported provider. Turn it on when yours is known to emit
# `at+jwt` — check a real token before you do.
#
# If `audience` above is an https URL you are already covered without this: an
# ID token's audience is the client id, which can never be this node's resource
# identifier, so the audience check refuses it first. This is then defence in
# depth. With an opaque audience it is the only check of its kind.
# require_at_jwt = false


# A claim whose string value is carried as a federated principal's DISPLAY
# name — in `kimmy whoami` and in the audit record (as `display`, when it
# differs from the subject). A provider's `sub` is stable and opaque (a GUID,
# an `00u…` string), which makes it a good identity and a bad thing to read in
# a log; `preferred_username`, `email` or `upn` is what a person recognises.
#
# Display ONLY. Role mappings, grants, rate limiting and every comparison the
# node makes still key on `sub`, and that is not configurable: an email is
# mutable, is not unique across providers, and at some providers is
# user-editable, so making it the principal would let a rename merge or split
# identities silently (ADR-100). A token whose claim is missing or not a string
# is not refused — the display simply falls back to `sub`. Check a real ACCESS
# token carries the claim before choosing it; ID tokens often carry more.
# subject_claim = "preferred_username"

# What a claim value is worth here. Repeat the block per role.
#
# Written inline rather than stored in the database on purpose (ADR-066):
# verification stays a pure function of the token plus this file, so there is no
# lookup on the request path and no way for two nodes to disagree about what a
# role means. Changing a mapping is an edit and a restart.
#
# A role nobody maps is not an error — it produces a principal with zero grants.
# The caller authenticated; they are simply not authorized here.
#
# `admin` is NOT mappable by default and a mapping that names it stops the node
# at startup. Administration is reserved to local accounts as a break-glass
# boundary: if this provider is misconfigured or taken over, nobody gets
# superuser over the database through it (ADR-067). read, write, watch, search,
# webhook and ddl all map freely — ddl (create/drop collections, indexes,
# embedding configuration) is the part of administration that is about the
# data rather than the server, and was split out so an agent behind an IdP can
# create the collection it writes to (ADR-090). See allow_federated_admin below.
# [[auth.oidc.role_mappings]]
# claim_value = "kimmydb-analyst"
# grants = [{ db = "sales", collection = "orders*", actions = ["read", "search"] }]

# [[auth.oidc.role_mappings]]
# claim_value = "kimmydb-writer"
# grants = [{ db = "sales", collection = "*", actions = ["write", "watch"] }]

# A mapping may instead name a ROLE stored in this database (ADR-073), so one
# definition serves both federated principals and local users rather than the
# same grants being copied into two places. Manage them at /v1/roles.
#
# Unlike inline grants, a named role is resolved on every request, so editing it
# applies to the next call rather than at the next restart. A name that matches
# no role grants nothing, which is also what a deleted role leaves behind.
#
# Note claim_value is the PROVIDER's vocabulary, not this database's: a provider
# typically enforces a small fixed set of role names at client registration, so
# a KimmyDB-specific value here may simply be unregistrable. That is the case
# for naming a role — all the granularity lives on this side.
#
# A mapping must name a role or carry grants (both is fine). One that does
# neither could never grant anything, so it is refused at startup as a typo.
# [[auth.oidc.role_mappings]]
# claim_value = "developer"
# role = "analyst"

# Let a federated principal hold `admin`, lifting the refusal described above.
#
# Off by default, which is exactly the behaviour that shipped. It exists because
# an absolute refusal makes a large deployment impossible rather than merely
# awkward: auditors flag privileged local accounts living outside the IdP, which
# that rule requires. The canonical pattern is to allow the mapping and
# SEPARATELY keep an emergency local account, not to forbid it (ADR-074).
#
# Turning it on moves a real security boundary, so the node says so in its
# startup summary every time.
# allow_federated_admin = false

# Every value above is also an environment variable: KIMMY_OIDC_ISSUER,
# KIMMY_OIDC_AUDIENCE, KIMMY_OIDC_ROLES_CLAIM, KIMMY_OIDC_SUBJECT_CLAIM,
# KIMMY_OIDC_REFRESH_INTERVAL_SECS.
#
# The mappings are file-only in the sense that there are still no per-mapping
# flags — a grant is a structure, and a command line is where structures go to
# be mistyped. But deployments that configure the node through an environment
# block (compose, swarm, kubernetes) do not edit TOML files inside containers,
# so the whole list can arrive as one JSON document instead:
#
#   KIMMY_OIDC_ROLE_MAPPINGS='[{"claim_value":"developer","role":"analyst"}]'
#   KIMMY_OIDC_ROLE_MAPPINGS='[{"claim_value":"user","grants":[{"db":"sales","actions":["read"]}]}]'
#
# When set, the variable REPLACES the file's list rather than merging with it.
# Every refusal above — empty mapping, inline `admin`, unknown action — applies
# unchanged, so check-config catches a bad value before the service sees it
# (ADR-078).
#
# allow_federated_admin stays file-only: it is a boundary an operator should
# have to write down and review in a diff rather than set from a shell.
#
# `kimmyd check-config` reaches the provider and reports what it found, and
# says whether this node publishes protected resource metadata. The server
# deliberately does not reach the provider: a briefly unreachable identity
# provider must not stop a database from restarting, so it retries in the
# background and local users keep working meanwhile.

[cluster]
# KimmyDB is leaderless: there is no primary, no election, and no quorum. Each
# node pulls the oplog entries it is missing from a few peers each round. Writes
# are accepted anywhere and converge by last-writer-wins.
enabled = false

# Cluster bind address. Both protocols share it:
#   UDP -- SWIM membership probes, so the cluster agrees who is alive
#   TCP -- version vectors, oplog entries and snapshots
#
# Peers authenticate on the TCP side with cluster_secret.
bind = "0.0.0.0:7900"

# Where to look for peers, re-resolved periodically so new pods are picked up
# without a restart. Accepted forms:
#
#   "k8s:kimmy-headless.default.svc.cluster.local"  headless Service, one A record per pod
#   "dns:seeds.kimmy.internal"                      A/AAAA records
#   "dns-srv:_kimmy._tcp.example.com"               SRV records -- parsed, NOT yet resolved
#   "static:10.0.0.1:7900,10.0.0.2:7900"            explicit list
#   "10.0.0.1:7900"                                 shorthand for a single static peer
seeds = []

# Shared secret authenticating node-to-node traffic. Required when clustering:
# without it any host that can reach the gossip port could inject writes. The
# placeholder below is refused when either listener is off loopback (ADR-093).
# cluster_secret = "generate-me-with-openssl-rand-base64-32"

# How often to contact each known peer for an anti-entropy round.
#
# A tick makes several pulls from a peer while it is behind: a pull that came
# back full at the batch cap is followed by another, until every pull comes
# back short of the cap or the tick has spent this interval (ADR-157). Another
# pull is started only if the one before it would have fitted in what is left,
# so a draining tick stops short of its own period. This bounds a tick's own
# length, not how fast a backlog drains.
sync_interval_secs = 5

# How often to re-resolve the seed sources.
#
# Slower than syncing on purpose: DNS is the expensive half and a pod set does
# not change every few seconds. But it must repeat -- a node that resolved only
# at startup would never see a peer that joined after it.
discovery_interval_secs = 30

# Gossip membership over UDP, so the cluster forms a shared opinion about which
# nodes are alive.
#
# With this off, peers come from discovery alone and each node forms its own
# private opinion from failed connections -- workable, but two nodes can then
# disagree about a third indefinitely, and a node absent from your seed list is
# never learned about.
membership = true

# Peers contacted per anti-entropy round.
#
# A cap, not a quota: a cluster smaller than this contacts everyone. Keeping it
# constant is what makes the per-round cost independent of cluster size --
# replication is transitive, so a write still reaches every node through
# intermediate peers. Peers that are failing are backed off and skipped, and do
# not count against this.
fanout = 3

[webhooks]
# Hosts a webhook may target beyond the public internet.
#
# Empty means public addresses only. Loopback, link-local (169.254.0.0/16 --
# cloud metadata), RFC1918 and carrier-NAT ranges are refused unless the host is
# named here, because otherwise anyone who can register a webhook can make this
# node probe its own network.
#
# The host is resolved and *every* address checked, at registration and again
# before each delivery: a name that resolves publicly today can resolve inward
# tomorrow. Naming a host exempts it from those checks entirely, so add only the
# ones you mean.
allowed_hosts = []

# Deliveries this node may have in flight at once, across all subscriptions.
#
# A bound, so a webhook on a hot collection cannot consume every outbound
# connection the node has. It is also why one endpoint that has stopped
# answering does not delay the subscriptions behind it -- a serial dispatcher
# would hold the pass for the full delivery timeout.
max_concurrent_deliveries = 8

# The largest request body a delivery may carry.
#
# Batches are trimmed to fit. A single event whose document already exceeds this
# is delivered with `fullDocument` omitted and `fullDocumentOmitted` set, rather
# than dropped -- the receiver still learns the change happened and can read the
# document itself.
max_payload_bytes = 1048576

[log]
# A tracing-subscriber filter directive. RUST_LOG overrides this when set.
level = "info"

# "pretty" for a terminal, "json" for a log shipper.
format = "pretty"

# ---------------------------------------------------------------------------
# Distributed tracing and OTLP metrics
# ---------------------------------------------------------------------------
#
# There is no `enabled` flag: telemetry is on when `endpoint` is set and off
# when it is not. A separate toggle would add an `enabled = true` with no
# endpoint, which can only ever be a startup failure.
#
# The whole section is commented out, which is the default: a database that
# opens an outbound connection nobody configured is a surprise, and an
# operator who wants traces knows they want them.
#
# [telemetry]

# Base URL of an OpenTelemetry collector -- the *base*, not a signal path.
# `/v1/traces` and `/v1/metrics` are appended, which is what
# OTEL_EXPORTER_OTLP_ENDPOINT means everywhere else, so you can paste the
# value your other services already use.
#
# **Plaintext only.** The exporter is built without a TLS backend, so an
# https:// endpoint is refused at startup rather than failing silently at
# every export (ADR-069). A collector is normally a sidecar or an in-cluster
# service; if yours is across an untrusted network, run a collector beside
# this node and let that one forward over TLS.
#
# endpoint = "http://otel-collector:4318"

# "http/protobuf" (default) or "http/json". No gRPC: it would add tonic and
# its build machinery for a wire format the collector already accepts over
# :4318, and ADR-016's rule about not adding native build dependencies is
# worth more than the encoding (ADR-069). Reach for "http/json" when a
# receiver is rejecting exports and you want to read one off a capture.
#
# protocol = "http/protobuf"

# Fraction of traces to record, 0.0 to 1.0. Sampling is *parent-based*: a
# request that arrives already carrying a sampled `traceparent` is recorded
# whatever this says, because a ratio applied independently per node produces
# traces with holes in them -- which is worse than fewer whole ones.
#
# 0.0 is refused while an endpoint is set. It would build an exporter that can
# never emit a span, and you would find that out from an empty dashboard weeks
# later. To turn telemetry off, remove `endpoint`.
#
# sample_ratio = 1.0

# Whether spans may carry database and collection names. **Off**, and this is
# the setting to think about before turning on.
#
# With it off, a span is named for its route template
# (`/v1/db/{db}/coll/{coll}/docs`) or its operation (`find`, `insert`), neither
# of which says anything about what you store -- the default is private by
# construction rather than by redaction. With it on, `db.namespace`,
# `db.collection.name` and `url.path` are exported too, which publishes your
# schema to whatever holds the traces and to everyone who can read it.
#
# Audit records are excluded from the exporter entirely either way: they carry
# principal names, and a collector is a different destination from a log file
# even when the same person runs both (ADR-068, docs/security.md).
#
# include_names = false

# What `service.name` this node reports itself as. One name for the whole
# deployment rather than one per node -- nodes are told apart by their
# resource attributes, and a per-node service name makes a three-node cluster
# look like three unrelated systems.
#
# service_name = "kimmydb"

# How long one export may take before it is abandoned. Exports are off the
# request path, so this bounds an exporter thread rather than a client: an
# unreachable collector costs a timeout every batch and nothing else.
#
# export_timeout_secs = 10

# Automatic embedding. The worker is the oplog consumer that turns collection
# changes into provider calls on this node; per-collection providers are
# configured through the API, not here. Disable the worker to make this node a
# consumer of embeddings rather than a producer of provider calls -- vectors
# still replicate in, and vector search keeps working. Same effect as the
# one-way flag --disable-vector-worker (KIMMY_DISABLE_VECTOR_WORKER).
[vector]
worker_enabled = true

# How the worker gathers documents into provider calls (ADR-095). The provider
# takes a batch; the worker fills one from consecutive documents of the same
# collection rather than sending each document's chunks alone. Measured against
# a CPU llama.cpp server: 32 calls of one short input took 394 ms, one call of
# 32 took 18 ms -- the difference between a live ingest that keeps up and one
# whose backlog grows without bound.
#
# These describe the round trip this node makes, which is why they are here and
# not in a collection's vector configuration. A batch only ever holds one
# collection's documents, so each collection's provider, model and prefix are
# respected as before, and the storage write stays per document.
[vector.batch]
# The most chunks in one call. Below every hosted provider's per-request input
# cap, so a batch is never re-split by the provider.
max_chunks = 32

# The most estimated tokens in one call, by the estimate a collection's
# chunk.max_tokens uses (one token per two bytes of UTF-8, an overestimate).
# The default is 32 chunks at the default chunk ceiling -- about 64 KiB of
# text. A single document over this goes alone rather than being split.
max_tokens = 32768

# How long a partial batch waits for more documents before it is sent, in
# milliseconds. Only waited when the stream is idle -- on a backlog the next
# document is already there -- so a quiet collection's document is delayed by
# at most this much, less than the remote round trip it saves. 0 sends
# whatever has queued the moment the stream is idle. Refused above 10000.
max_wait_ms = 100

# Bound on the HNSW graphs held in memory across every vector collection this
# node serves. A graph costs about dim x 4 + 5,000 bytes per chunk -- 6.5 KB at
# 384 dimensions, 11 KB at 1,536 -- and is kept once its collection has been
# searched. Past this bound the least recently searched graphs are dropped and
# their collections pay a snapshot reload, or a rebuild, on their next search;
# a single graph larger than the whole bound is held anyway, with a warning,
# because a search is never refused over memory. 512 MiB by default: a ceiling
# rather than an allocation, and larger than the page cache because an eviction
# here costs seconds of rebuild where one there costs microseconds. Size it so
# the routinely searched collections fit -- the sum of their chunks times the
# per-chunk bytes -- and watch kimmy_vector_index_cache_bytes. Zero lifts the
# bound, which is the behaviour before it existed (ADR-103).
[vector.index_cache]
max_bytes = 536870912

# What an embedding provider may be handed, and where it may be sent (ADR-115).
#
# A collection's vector configuration names an endpoint and the environment
# variable holding the key for it, and the provider sends that variable's value
# to that endpoint with every batch of text. Both are chosen by whoever holds
# `ddl` on the collection, so this section is what keeps that from being a way
# to read the node's own secrets or to probe its network.
[vector.provider]
# Variables a provider may be handed: exact names, or a prefix with one
# trailing `*`. A collection's `api_key_env` outside this list is refused by
# name. The default admits the documented hosted providers' variables (the
# three dialect defaults and DeepInfra's) and the KIMMY_PROVIDER_* namespace,
# so a key for one of those, or set as KIMMY_PROVIDER_<anything>, needs no
# line here.
#
# Every other KIMMY_* variable -- the signing secret, the cluster secret, the
# root password -- is refused whatever this says, and naming one here (or a
# pattern that reaches one, such as "KIMMY_*") stops the node at startup.
allowed_key_env = ["OPENAI_API_KEY", "COHERE_API_KEY", "GEMINI_API_KEY", "DEEPINFRA_API_KEY", "KIMMY_PROVIDER_*"]

# Hosts a provider may be sent to beyond the public internet, with the same
# meaning as webhooks.allowed_hosts: empty is public addresses only, and
# loopback, link-local and private ranges are refused unless the host is named
# here. The host is resolved and every address checked, when the collection is
# configured and again inside the client at connect time. An Ollama or
# llama.cpp on this host or on the LAN needs its host listed.
allowed_hosts = []

# Refuse every provider kind but `profile`, `byo` and `local` when a collection
# is configured, so the endpoints this node sends text to are exactly the
# profiles defined below and no others.
endpoints_locked = false

# Providers defined here rather than in a collection. Each table takes the
# fields a collection's `provider` object would -- `kind`, `model`, `endpoint`,
# `api_key_env`, `dimensions` -- and a collection uses it as
# {"kind": "profile", "name": "<name>"}: the endpoint, model and key variable
# stay in this file. A profile is held to the two rules above at startup and by
# `kimmyd check-config`.
#
# [vector.providers.corp]
# kind = "open_ai"
# model = "text-embedding-3-small"
# endpoint = "https://embeddings.example.com"
# api_key_env = "KIMMY_PROVIDER_CORP"
#
# [vector.providers.lan]
# kind = "ollama"
# model = "nomic-embed-text"
# endpoint = "http://embed-host:11434"   # needs its host in allowed_hosts
