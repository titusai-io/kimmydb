# Three-node KimmyDB cluster for local development.
#
# Discovery note: Compose's built-in DNS resolves the service alias `kimmy` to
# every container carrying it, which is the same shape as a Kubernetes headless
# Service. That is why all three nodes share one seed setting.
#
# Why each node pins an IP
# ------------------------
# `cluster.bind` defaults to the wildcard `0.0.0.0:7900`. A wildcard is a
# listening instruction, not an identity, so the node refuses to announce it and
# falls back to advertising loopback with a warning (ADR-037). Inside containers
# that quietly degrades gossip: every node tells its peers to reach it at
# 127.0.0.1, which is each peer's own container.
#
# Replication still converges, because anti-entropy dials the addresses that
# discovery resolved. What is lost is SWIM — learning peers nobody configured,
# and a *shared* opinion about which nodes are alive. So each service pins an
# address on a fixed subnet and binds the cluster listener to it.
#
# `cluster.bind` is a SocketAddr and takes an IP literal, not a hostname, which
# is why this is a static address rather than `kimmy1:7900`. On Kubernetes use
# the downward API instead — see docs/operations.md.

x-kimmy-common: &kimmy-common
  build:
    context: .
  image: kimmydb:dev
  restart: unless-stopped
  environment: &kimmy-env
    KIMMY_ROOT_USER: root
    # The three secrets have no defaults, deliberately. Inside a container the
    # HTTP listener binds 0.0.0.0, and off loopback the node refuses to start
    # with any of the placeholder values this repository's examples use
    # (ADR-093) — the ones this file used to fall back to included. Compose
    # stops at `up` instead, naming the variable. Put real values in a `.env`
    # beside this file (it is gitignored) or in the environment:
    #
    #   KIMMY_ROOT_PASSWORD=$(openssl rand -base64 18)
    #   KIMMY_JWT_SECRET=$(openssl rand -base64 32)
    #   KIMMY_CLUSTER_SECRET=$(openssl rand -base64 32)
    #
    # Every node must sign tokens with the same key, or a token minted by one
    # node is rejected by the next request that lands elsewhere — which is why
    # all three services share this one block.
    KIMMY_ROOT_PASSWORD: ${KIMMY_ROOT_PASSWORD:?set KIMMY_ROOT_PASSWORD (a .env file beside docker-compose.yml works)}
    KIMMY_JWT_SECRET: ${KIMMY_JWT_SECRET:?set KIMMY_JWT_SECRET to 32+ random bytes, e.g. openssl rand -base64 32}
    KIMMY_CLUSTER_SECRET: ${KIMMY_CLUSTER_SECRET:?set KIMMY_CLUSTER_SECRET to random bytes, e.g. openssl rand -base64 32}
    KIMMY_SEEDS: dns:kimmy:7900
    KIMMY_LOG_LEVEL: ${KIMMY_LOG_LEVEL:-info}
  stop_grace_period: 30s

services:
  kimmy1:
    <<: *kimmy-common
    container_name: kimmy1
    environment:
      <<: *kimmy-env
      KIMMY_CLUSTER_BIND: 172.28.0.11:7900
    networks:
      default:
        aliases: [kimmy]
        ipv4_address: 172.28.0.11
    ports:
      - "7878:7878"
    volumes:
      - kimmy1-data:/var/lib/kimmy

  kimmy2:
    <<: *kimmy-common
    container_name: kimmy2
    environment:
      <<: *kimmy-env
      KIMMY_CLUSTER_BIND: 172.28.0.12:7900
    networks:
      default:
        aliases: [kimmy]
        ipv4_address: 172.28.0.12
    ports:
      - "7879:7878"
    volumes:
      - kimmy2-data:/var/lib/kimmy

  kimmy3:
    <<: *kimmy-common
    container_name: kimmy3
    environment:
      <<: *kimmy-env
      KIMMY_CLUSTER_BIND: 172.28.0.13:7900
    networks:
      default:
        aliases: [kimmy]
        ipv4_address: 172.28.0.13
    ports:
      - "7880:7878"
    volumes:
      - kimmy3-data:/var/lib/kimmy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  kimmy1-data:
  kimmy2-data:
  kimmy3-data:
