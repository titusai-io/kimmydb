[workspace]
resolver = "3"
members = [
    "crates/kimmy-core",
    "crates/kimmy-storage",
    "crates/kimmy-query",
    "crates/kimmy-egress",
    "crates/kimmy-vector",
    "crates/kimmy-auth",
    "crates/kimmy-cluster",
    "crates/kimmy-mcp",
    "crates/kimmy-api",
    "crates/kimmy-client",
    "crates/kimmyd",
    "crates/kimmy-cli",
    # The fuzz harness bodies, as a plain crate so they compile on stable under
    # the ordinary PR gate. The libFuzzer entry points that call them are in
    # `fuzz/`, below, which needs nightly and so stays out (ADR-111).
    "crates/kimmy-fuzz-harness",
]
# Its own root with its own lockfile. `cargo fuzz` builds it with a sanitizer
# on nightly, and a workspace member would drag `libfuzzer-sys` -- and its C++
# runtime -- into every `cargo build` here.
exclude = ["fuzz"]

[workspace.package]
version = "0.19.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/titusai-io/kimmydb"
homepage = "https://github.com/titusai-io/kimmydb"
authors = ["Titus AI LLC <licensing@titusai.io>"]

[workspace.dependencies]
# Internal crates
kimmy-core = { path = "crates/kimmy-core" }
kimmy-storage = { path = "crates/kimmy-storage" }
kimmy-query = { path = "crates/kimmy-query" }
kimmy-egress = { path = "crates/kimmy-egress" }
kimmy-vector = { path = "crates/kimmy-vector" }
kimmy-auth = { path = "crates/kimmy-auth" }
kimmy-cluster = { path = "crates/kimmy-cluster" }
kimmy-mcp = { path = "crates/kimmy-mcp" }
kimmy-api = { path = "crates/kimmy-api" }
kimmy-client = { path = "crates/kimmy-client" }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
http-body-util = "0.1"
# The `Frame` and `SizeHint` types a body wrapper's signature has to name;
# axum re-exports the trait but not those.
http-body = "1"

# TLS termination. `axum::serve` has no TLS, and the serving stack is
# load-bearing here for two reasons beyond encryption: connection info must
# survive (the login limiter keys on the peer address) and graceful shutdown
# must keep working (`docker stop` returns in ~20 ms).
#
# `tls-rustls-no-provider` rather than `tls-rustls`, deliberately. The default
# feature selects **aws-lc-rs**, which needs CMake and a full C build; `ring` is
# already in the tree via `reqwest`, so taking the provider we already pay for
# adds no new toolchain requirement. See ADR-016 and ADR-039.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing, not a convenience. Without it
# `serde_json::Map` is a BTreeMap and every object that crosses the HTTP or MCP
# boundary has its keys sorted alphabetically before the query language sees
# them: `{"$set": {"a": 1}, "$inc": {"a": 5}}` applied as `$inc` then `$set`,
# a stored document's fields reordered, a sort document's keys reordered. The
# parsers all iterate the BSON document in order and were right; the boundary
# was throwing the order away (ADR-120).
serde_json = { version = "1", features = ["preserve_order"] }
# Encodes a `Vec<u8>` as BSON binary rather than as an array of int32s, which is
# what serde does by default and what made every replicated document twelve times
# its own size on the wire. Pure Rust, and already in the tree under `bson`.
serde_bytes = "0.11"
bson = { version = "3", features = ["serde", "serde_json-1", "uuid-1"] }
toml = "1"

# Storage
redb = "4.1"

# HTTP client. Shared by the remote embedding providers and the `kimmy` CLI, so
# the two cannot drift apart on features -- `rustls-tls` matters, because the
# default would pull OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.23"

# DNS, for SRV discovery. The standard library resolves names, not record
# types, so reading the ports SRV carries needs a resolver.
#
# `default-features = false` is load-bearing, not tidiness. Every transport
# this crate can speak beyond plain DNS — DoT, DoH, QUIC, h3 — and DNSSEC
# validation each come in a `-ring` and an `-aws-lc-rs` flavour, and the
# aws-lc-rs ones would add CMake for primitives `ring` already provides. None
# is needed to read an SRV record over UDP. `system-config` reads
# /etc/resolv.conf, which is what makes a container inherit its cluster's
# resolver rather than needing one configured. See ADR-050.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# Auth. argon2 0.6 is still a release candidate; password hashing is not the
# place to run ahead of a stable release.
argon2 = { version = "0.5", features = ["std"] }
# rust_crypto rather than aws_lc_rs. Note the build is NOT free of a C
# toolchain and has not been since M2 — `reqwest` pulls `ring`, which ships C
# and assembly (ADR-016 records the correction). The rule that survives is to
# not add a *second* native crypto stack: `ring` is already paid for, and
# aws_lc_rs would add CMake for the same primitives.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.9"

# The global allocator for `kimmyd`, and the second native library in the
# default build beside `ring` (ADR-117). Every channel ships the static musl
# binary (ADR-063, ADR-107), and a musl binary that sets no allocator runs on
# musl's malloc, which takes one lock for every allocation: under eight
# concurrent clients a paged `find` measured thirteen times slower than the
# same code linked against glibc, and `count` ten times. mimalloc closes the
# gap and then some, on every target alike. One vendored C library with no
# system dependency, compiled by the `cc` the build already needs for `ring`;
# default features, so the tree it builds is the one its authors test.
# Set in the binary crate only -- a library that sets `#[global_allocator]`
# decides for every program that links it.
mimalloc = "0.1"

# OpenTelemetry. The API crate is separated from the SDK on purpose: the
# library crates take `opentelemetry` (context and propagation types only, no
# exporter, no runtime) and the binary takes the SDK, so nothing but `kimmyd`
# can decide where a span goes.
#
# **HTTP transport, never gRPC** (ADR-069). `default-features = false` drops
# the `grpc-tonic` default, which would pull `tonic`, `prost` and their build
# machinery for a wire format the OpenTelemetry Collector already accepts over
# :4318. Doing it this way rides the `reqwest` + `rustls`/`ring` stack the tree
# already carries, so `scripts/check-native-deps.sh` needs no new entry —
# the same reasoning that picked `ring` over `aws-lc-rs` in ADR-016 and 039.
#
# `reqwest-blocking-client` rather than `reqwest-client`: `logging::init` runs
# **before** the tokio runtime is built (see `kimmyd/src/main.rs`), so an async
# exporter would be constructed with no reactor to drive it. The blocking
# client owns its own threads and does not care.
#
# `internal-logs` is kept out of the `default-features = false` sweep on
# purpose. It is what makes the exporter's own failures visible: without it a
# node pointed at the wrong port serves perfectly and exports nothing, forever,
# with no line anywhere saying so — the same quiet failure the TLS reload and
# JWKS refresh counters exist for. The events go to the `opentelemetry` target
# and are raised from the exporter's own threads, where no span is open, so
# they reach the log and cannot feed back into the exporter.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "http-json", "reqwest-blocking-client", "internal-logs"] }
opentelemetry-semantic-conventions = "0.32"
# The bridge: converts `tracing` spans into OTel spans, which is what lets
# `kimmy-storage`, `kimmy-cluster` and `kimmy-vector` be instrumented with the
# `tracing` they already have and no new dependency at all.
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"] }

# Dev / test
proptest = "1"
tempfile = "3"
# Structured inputs for the fuzz harnesses (ADR-111): turns fuzzer bytes into
# BSON values and token claims. Pure Rust, and reaches the tree only through
# `kimmy-fuzz-harness`, which ships nothing.
arbitrary = "1"
# The protocol spec and its contract test (ADR-056). Both are dev-only: the
# server does not read its own specification, and nothing here ships.
#
# `serde_norway` rather than `serde_yaml`, which is archived. YAML rather than
# JSON for the spec itself because the document is written and reviewed by
# hand, and a hand-written JSON document of that size stops being read.
serde_norway = "0.9"
jsonschema = { version = "0.49", default-features = false }
# Benchmarks. `html_reports` off: the numbers get recorded in docs/benchmarks.md
# by hand, and an untracked report directory is noise in a repo.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true

# What `dist` builds release artifacts with. Nothing beyond `release` on
# purpose: the binary an operator downloads should be built the way the one
# CI tested was.
[profile.dist]
inherits = "release"
