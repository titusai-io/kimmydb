[workspace]
resolver = "3"
members = [
    "crates/kimmy-core",
    "crates/kimmy-storage",
    "crates/kimmy-query",
    "crates/kimmy-vector",
    "crates/kimmy-auth",
    "crates/kimmy-cluster",
    "crates/kimmy-mcp",
    "crates/kimmy-api",
    "crates/kimmy-client",
    "crates/kimmyd",
    "crates/kimmy-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/titusai-io/kimmydb"
authors = ["Chris Gruber <chris@titusai.io>"]

[workspace.dependencies]
# Internal crates
kimmy-core = { path = "crates/kimmy-core" }
kimmy-storage = { path = "crates/kimmy-storage" }
kimmy-query = { path = "crates/kimmy-query" }
kimmy-vector = { path = "crates/kimmy-vector" }
kimmy-auth = { path = "crates/kimmy-auth" }
kimmy-cluster = { path = "crates/kimmy-cluster" }
kimmy-mcp = { path = "crates/kimmy-mcp" }
kimmy-api = { path = "crates/kimmy-api" }
kimmy-client = { path = "crates/kimmy-client" }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http-body-util = "0.1"

# TLS termination. `axum::serve` has no TLS, and the serving stack is
# load-bearing here for two reasons beyond encryption: connection info must
# survive (the login limiter keys on the peer address) and graceful shutdown
# must keep working (`docker stop` returns in ~20 ms).
#
# `tls-rustls-no-provider` rather than `tls-rustls`, deliberately. The default
# feature selects **aws-lc-rs**, which needs CMake and a full C build; `ring` is
# already in the tree via `reqwest`, so taking the provider we already pay for
# adds no new toolchain requirement. See ADR-016 and ADR-039.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = { version = "3", features = ["serde", "serde_json-1", "uuid-1"] }
toml = "1"

# Storage
redb = "4.1"

# HTTP client. Shared by the remote embedding providers and the `kimmy` CLI, so
# the two cannot drift apart on features -- `rustls-tls` matters, because the
# default would pull OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.23"

# DNS, for SRV discovery. The standard library resolves names, not record
# types, so reading the ports SRV carries needs a resolver.
#
# `default-features = false` is load-bearing, not tidiness. Every transport
# this crate can speak beyond plain DNS — DoT, DoH, QUIC, h3 — and DNSSEC
# validation each come in a `-ring` and an `-aws-lc-rs` flavour, and the
# aws-lc-rs ones would add CMake for primitives `ring` already provides. None
# is needed to read an SRV record over UDP. `system-config` reads
# /etc/resolv.conf, which is what makes a container inherit its cluster's
# resolver rather than needing one configured. See ADR-050.
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }

# Auth. argon2 0.6 is still a release candidate; password hashing is not the
# place to run ahead of a stable release.
argon2 = { version = "0.5", features = ["std"] }
# rust_crypto rather than aws_lc_rs. Note the build is NOT free of a C
# toolchain and has not been since M2 — `reqwest` pulls `ring`, which ships C
# and assembly (ADR-016 records the correction). The rule that survives is to
# not add a *second* native crypto stack: `ring` is already paid for, and
# aws_lc_rs would add CMake for the same primitives.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.9"

# Dev / test
proptest = "1"
tempfile = "3"
# The protocol spec and its contract test (ADR-056). Both are dev-only: the
# server does not read its own specification, and nothing here ships.
#
# `serde_norway` rather than `serde_yaml`, which is archived. YAML rather than
# JSON for the spec itself because the document is written and reviewed by
# hand, and a hand-written JSON document of that size stops being read.
serde_norway = "0.9"
jsonschema = { version = "0.49", default-features = false }
# Benchmarks. `html_reports` off: the numbers get recorded in docs/benchmarks.md
# by hand, and an untracked report directory is noise in a repo.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
