name: diag perms
on:
  workflow_dispatch:
jobs:
  inherit-default:
    runs-on: ubuntu-latest
    steps:
      - name: no permissions block
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "variant=inherit-default"
          gh api /user --jq .login 2>&1 | head -1
  contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: contents read only
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "variant=contents-read"
          gh api /user --jq .login 2>&1 | head -1
  write-all:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: write all
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "variant=write-all"
          gh api /user --jq .login 2>&1 | head -1
          gh api repos/titusai-io/kimmydb/releases -F tag_name=v9.9.9-diag -F name=diag 2>&1 | head -1
          RID=$(gh api repos/titusai-io/kimmydb/releases/tags/v9.9.9-diag --jq '.id' 2>/dev/null)
          [ -n "$RID" ] && gh api -X DELETE repos/titusai-io/kimmydb/releases/$RID && echo cleaned
