# The multi-arch container image: ghcr.io/titusai-io/kimmydb.
#
# Not run on its own. The dist-generated release workflow calls this as its
# `./publish-ghcr` publish job (see dist-workspace.toml), after the tag's
# binaries have been built and the GitHub Release has been created — so an
# image only ever exists for a tag whose artifacts built on every platform.
#
# Nothing is compiled here. The image ships the `kimmyd` from the release
# archive for its architecture: the `kimmyd-<target>.tar.xz` dist built in
# `build-local-artifacts` is taken from this run's workflow artifacts (on a
# manual dispatch, from the Release itself), checked against the checksum dist
# wrote beside it, and handed to the Dockerfile's `prebuilt` stage. Before
# this, each architecture compiled the workspace a second time inside BuildKit
# — nine minutes on amd64, after the same binary had already been built and
# attached to the Release — and the file in the image and the file on the
# Release page were two builds of one commit rather than one file. Now they
# are one file, which is also the shorter path: what is left per architecture
# is downloading an archive and building the runtime layer.
#
# Still two native runners and a manifest merge, rather than one buildx run
# with QEMU: the runtime stage's apt layer is what remains to do per
# architecture, and it is slow under emulation and free on GitHub's arm64
# runners. And the digest-then-merge flow is the one that has produced every
# tag so far; changing where the binary comes from was no reason to change
# how the manifest is assembled.

name: Publish to GHCR

on:
  workflow_call:
    inputs:
      # The dist plan manifest. Unused here — the image is defined by the tag
      # that triggered the release — but a caller cannot pass an undeclared
      # input, and dist always passes this one.
      plan:
        required: true
        type: string
  # Manual re-publish of an existing tag's image: same binaries, same
  # manifest, no release flow required. The input is the tag (v-prefixed), and
  # every step that would have read github.sha or github.ref_name reads
  # inputs.tag_name instead so a dispatch lands exactly where the release
  # flow would have.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/titusai-io/kimmydb

jobs:
  build:
    name: build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      # `target` is the dist target whose archive this platform's image ships;
      # it names the workflow artifact and the archive inside it.
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # The tag is the source of truth: resolve it to its commit so the image
      # reports the released code regardless of which ref dispatched this.
      - name: Resolve release commit
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -n "$TAG" ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            echo "commit=$SHA" >> "$GITHUB_OUTPUT"
            echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      # In the release flow the archive comes from this run: dist uploaded it
      # from `build-local-artifacts` under this name (see release.yml), and
      # `host`, which this job runs after, has already attached the same file
      # to the Release. Downloaded outside the checkout so nothing but the
      # binary enters the build context.
      - name: Fetch the release archive
        if: ${{ !inputs.tag_name }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: ${{ runner.temp }}/archive

      # A manual dispatch has no run to take artifacts from, so the same file
      # comes from the Release, with the checksum published beside it.
      - name: Fetch the release archive (dispatch)
        if: ${{ inputs.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag_name }}" \
            --pattern "kimmyd-${{ matrix.target }}.tar.xz" \
            --pattern "kimmyd-${{ matrix.target }}.tar.xz.sha256" \
            --dir "$RUNNER_TEMP/archive"

      # Verify the archive against dist's checksum, unpack only the binary,
      # and run it: a static musl binary runs on the runner that will build
      # its image, so `--version` proves the file is the right architecture
      # and shows the commit it reports, before anything is pushed. The
      # commit is baked in by dist's build — it compiled from a checkout with
      # `.git` — which is why no GIT_COMMIT build argument is passed below.
      - name: Unpack kimmyd
        env:
          ARCHIVE: kimmyd-${{ matrix.target }}.tar.xz
        working-directory: ${{ runner.temp }}/archive
        run: |
          sha256sum -c "$ARCHIVE.sha256"
          mkdir -p "$GITHUB_WORKSPACE/.prebuilt"
          tar -xJf "$ARCHIVE" --strip-components=1 -C "$GITHUB_WORKSPACE/.prebuilt" \
            "${ARCHIVE%.tar.xz}/kimmyd"
          chmod +x "$GITHUB_WORKSPACE/.prebuilt/kimmyd"
          "$GITHUB_WORKSPACE/.prebuilt/kimmyd" --version

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, not by tag: the tags belong to the merged manifest,
      # and a per-arch tag would be one more thing to explain in `docker pull`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            KIMMYD_SOURCE=prebuilt
          labels: |
            org.opencontainers.image.source=https://github.com/titusai-io/kimmydb
            org.opencontainers.image.revision=${{ steps.rel.outputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Read-only reuse of the cache CI writes from main (base images and
          # the apt layer — see the note in ci.yml on why mode=min is enough).
          cache-from: type=gha

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest and tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      # For the provenance attestation at the end of this job: `id-token` to
      # obtain the workflow's OIDC identity that signs it, `attestations` to
      # store it. Granted to this job by dist-workspace.toml's
      # `github-custom-job-permissions`, since the caller sets the ceiling.
      id-token: write
      attestations: write
    steps:
      # The same resolution as in `build`, because the commit tag below reads
      # it and a step's outputs do not cross jobs. Until this was here the
      # tag was a literal `sha-` on every release, each one overwriting the
      # last.
      - name: Resolve release commit
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -n "$TAG" ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: ghcr-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, X.Y and latest from the release tag, plus the exact commit.
      # No bare X tag while the workspace is pre-1.0: every 0.MINOR may break
      # (ADR-062), so a floating `0` would promise a stability 0.x does not have.
      #
      # `latest` is guarded on the tag having no `-` in it, so a prerelease
      # cannot become it. dist skips publish jobs on prereleases today, which
      # means the guard is currently belt and braces — and it stops being that
      # the moment prerelease publishing is turned on for a shakeout, at which
      # point `v0.2.0-rc.1` would silently become what `docker pull kimmydb`
      # gives everybody.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.ref_name }}
            type=raw,value=sha-${{ steps.rel.outputs.short }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag_name || github.ref_name, '-') }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf -- "$IMAGE@sha256:%s " *)

      - name: Inspect the result
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # The digest of the multi-arch index just created. That is the subject
      # of the attestation, rather than either per-architecture image beneath
      # it, because it is what `docker pull kimmydb:<tag>` resolves to and so
      # what an operator will hand to `gh attestation verify`.
      - name: Resolve manifest digest
        id: manifest
        run: |
          digest=$(docker buildx imagetools inspect \
            "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Build provenance (ADR-108): a SLSA provenance statement naming this
      # repository, this workflow and the commit it ran at, signed keylessly
      # through Sigstore by the run's own OIDC identity — no key to keep, so
      # none to leak — stored by GitHub and pushed to GHCR beside the image.
      # Verify with
      #   gh attestation verify oci://ghcr.io/titusai-io/kimmydb:<tag> -R titusai-io/kimmydb
      #
      # Conditional on the repository being public. GitHub generates
      # attestations for a private repository only on an Enterprise Cloud
      # plan and fails the step otherwise, so while the repository is private
      # this step is skipped, visibly, in the run log. The condition reads
      # the event's own repository record, so the first release after the
      # repository is made public attests its image with no change here.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
