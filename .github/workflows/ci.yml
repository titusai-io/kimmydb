name: CI

on:
  push:
    branches: [main]
    # Kept here, deliberately, where it is removed from the pull request
    # trigger below: nothing waits on a status for a push, so no docs commit
    # is ever held up by its absence, and a push to main is the event that
    # additionally starts the two release-shaped builds. The pull request
    # that carried the commit reported its verdict before the merge.
    paths-ignore:
      - "**.md"
      - "docs/**"
  # No `paths-ignore` here, and this is load-bearing. Branch protection on main
  # requires the `fmt, clippy` and `test` contexts by name, and a workflow that
  # never starts reports no context at all — so filtering documentation-only
  # pull requests out at the trigger left them waiting forever on a status that
  # no run existed to deliver, mergeable only by an admin override. The
  # filtering happens inside the jobs now; see the `changes` job below.
  pull_request:
  # A run on request, for re-checking main without pushing to it: after a run
  # was cancelled or its runner lost, or to rewrite the caches after a quiet
  # week has let them age out.
  workflow_dispatch:

# Successive pushes to the same branch supersede each other: only the newest
# commit's run is ever read, so the older ones burn minutes computing an answer
# nobody looks at. Cancel them — everywhere but on main. A cancelled run on
# main is a commit whose verdict was never delivered: a failing run there was
# cancelled by the push that followed it, and the break went unreported for an
# hour. On main every run finishes. The group is still keyed on the ref so a
# push to main never cancels a concurrent PR run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# `RUSTFLAGS: -D warnings` and `CARGO_PROFILE_TEST_DEBUG: 0` are set on the
# four jobs that compile the gate, not here, because the two `build kimmyd`
# jobs at the end must carry exactly the environment the release build has.
# rust-cache hashes every `CARGO_*` and `RUST*` variable it can see into its
# key, and cargo fingerprints every artifact with the RUSTFLAGS it was built
# under, so one extra variable here would make the cache those jobs write
# unreadable, or unusable, on a tag (ADR-118).

jobs:
  # What changed, decided once and read by the two required jobs below.
  #
  # This is the half of the fix that a trigger cannot do. Skipping a workflow
  # and skipping a job look alike from the outside but are not: a workflow that
  # never starts reports nothing, while a job that starts and runs no steps
  # still reports its own context, green. So the required jobs always start,
  # and ask this one whether there is anything worth compiling. Whoever is
  # tempted to move this back up into `paths-ignore` on the pull request
  # trigger: that is the exact shape that deadlocked a documentation-only pull
  # request against branch protection.
  #
  # The diff is taken against the merge base of the pull request rather than
  # against its previous head, so the answer describes the whole proposed
  # change and is the same whether the branch carries one commit or thirty,
  # and whether it was force-pushed since the last run. Anything the job
  # cannot resolve into a range — a manual dispatch, a rewritten history whose
  # old tip is gone — is reported as not documentation-only, because being
  # wrong in that direction costs a few minutes of runner time and being wrong
  # in the other puts unreviewed code on main.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # Whether the storage-cache-metrics feature's tests run: see that step
      # in the `test` job.
      cache_feature: ${{ steps.classify.outputs.cache_feature }}
    steps:
      # The whole history, because the classification is a diff against the
      # merge base and the default single-commit fetch cannot reach it. The
      # repository is small enough that this costs seconds.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null \
             || ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            echo "No usable range (${BASE:-none}...${HEAD:-none}); running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "cache_feature=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots: the diff from the merge base of the two commits, not
          # between their tips, so a base branch that moved under the pull
          # request does not turn other people's commits into this one's.
          changed="$(git diff --name-only "${BASE}...${HEAD}")"
          echo "Changed files:"
          echo "${changed:-(none)}"

          if [ -z "$changed" ]; then
            echo "An empty range tells us nothing; running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "cache_feature=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same two patterns the trigger used to carry: any Markdown file
          # anywhere, and everything under docs/.
          if printf '%s\n' "$changed" | grep -qvE '\.md$|^docs/'; then
            echo "Something outside the documentation changed; running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only; fmt and clippy will report without compiling, and the test job will run the tests that read documentation files."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

          # The storage-cache-metrics feature's tests recompile redb,
          # kimmy-storage, kimmy-api and kimmyd cold, several minutes, so they
          # run only when something they guard changed: those three crates,
          # the manifests, or this workflow. Always on a push to main, so main
          # itself is never left untested with the feature.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] \
             || printf '%s\n' "$changed" \
                | grep -qE '^crates/kimmy-storage/|^crates/kimmy-api/|^crates/kimmyd/|^Cargo\.(toml|lock)$|^\.github/workflows/ci\.yml$'; then
            echo "cache_feature=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the storage-cache-metrics tests guard changed; skipping them."
            echo "cache_feature=false" >> "$GITHUB_OUTPUT"
          fi

  # The pull-request gate is two jobs so that the cheap verdicts arrive first:
  # formatting and clippy are done in about a minute against a warm cache, the
  # test suite takes most of ten. As one job, a formatting slip was reported
  # only after the tests had run to the end. Each job restores its own cache
  # rather than a shared one, because rust-cache keys on the job and the two
  # compile different things — clippy keeps check metadata, the tests keep
  # test binaries — so a cache saved by the other would be a cold start with
  # extra steps.
  lint:
    name: fmt, clippy
    runs-on: ubuntu-latest
    needs: changes
    # The gate has to report even when the job it consults did not: without
    # this, a broken `changes` job would skip both required jobs, and a skipped
    # required check is counted as a passing one by branch protection. Skipped,
    # its outputs are empty, which reads as not documentation-only below and
    # runs everything.
    if: ${{ !cancelled() }}
    env:
      # Debug info roughly doubles CI build time and nothing here reads a
      # backtrace symbol table.
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -D warnings
    steps:
      # Every step below is gated on there being code to check. On a
      # documentation-only change the job still runs, runs nothing, and
      # reports `fmt, clippy` green in a few seconds.
      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Install Rust
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Restore on every run; **save only from main**.
      #
      # A cache is scoped to the ref that wrote it, and a pull request can
      # already read the base branch's. Saving from PR branches too was
      # writing a second copy of a cache byte-identical to main's under
      # `refs/pull/N/merge` — the repo sat at exactly the 10 GiB ceiling with
      # 87% of it duplicate Rust caches, so GitHub was evicting main's entries
      # to make room for copies of them.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ADR-001 and ADR-016 both cite keeping the build free of a C toolchain.
      # That stopped being true in M2 and nobody noticed for two milestones,
      # because the claim lived in prose that nothing checked. This is the
      # narrower rule that replaced it, enforced: do not add a second native
      # stack. Adding one is still allowed — it just has to be a deliberate
      # line in scripts/allowed-native-deps.txt rather than a surprise. It
      # rides with the fast job because `cargo tree` reads the lockfile and
      # compiles nothing.
      - name: Native build dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/check-native-deps.sh

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    # Reports even when `changes` did not — see the note on the `lint` job.
    if: ${{ !cancelled() }}
    env:
      # Debug info roughly doubles CI build time and nothing here reads a
      # backtrace symbol table.
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -D warnings
    steps:
      # Not gated on there being code, unlike the `lint` job: a
      # documentation-only change has tests of its own to run, below. Some test
      # targets read documentation files -- which ones, and how many, changes as
      # tests are added -- so on exactly the changes that can break them this
      # job used to run nothing at all and report green.
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Save only from main — see the note on the `lint` job above.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # nextest rather than `cargo test`: every test runs in its own process,
      # so a panic, a leaked thread or a stray global in one test cannot take
      # the rest of its binary down with it, and a failure is reported against
      # the test that failed rather than the binary that died. And the test
      # binaries of all the workspace's crates run at once instead of one
      # binary after another, which is where the time went on a workspace of
      # a dozen small crates. nextest does not run doctests; the step after
      # runs them with `cargo test --doc`, against the same build artifacts.
      # Pinned to a release of the installer rather than its floating tag.
      - name: Install nextest
        uses: taiki-e/install-action@v2.87.16
        with:
          tool: nextest

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          KIMMY_TEST_NODE_LOGS: ${{ runner.temp }}/node-logs
        run: cargo nextest run --workspace

      # The page cache's statistics are a build feature, off by default, so the
      # run above never compiles them. These are the crates that do: all of
      # kimmy-api, whose render, golden and documentation tests change with the
      # feature; kimmy-storage's cache tests, since the rest of that crate
      # does not; and kimmyd, whose OTLP bridge registers the cache instruments
      # only with the feature, linted with it and checked by the bridge tests
      # that compare every rendered series with the instruments.
      - name: Test the storage-cache-metrics feature
        if: >-
          needs.changes.outputs.docs_only != 'true'
          && needs.changes.outputs.cache_feature != 'false'
        run: |
          cargo nextest run -p kimmy-storage -p kimmy-api -p kimmyd \
            --features kimmy-storage/cache-metrics,kimmy-api/storage-cache-metrics,kimmyd/storage-cache-metrics \
            -E 'package(kimmy-api) | (package(kimmy-storage) & test(/cache/)) | (package(kimmyd) & test(/bridge/))'
          cargo clippy -p kimmyd --all-targets --features storage-cache-metrics -- -D warnings

      # Every test that reads a documentation file lives in `kimmy-api`, which
      # `documentation_tests_live_in_this_crate` holds true, so this is the
      # whole set of them and there is no list here to fall out of date. The
      # crate rather than those targets by name: a list of target names is the
      # hand-maintained guard that produced this gap, since nothing makes
      # whoever adds a doc-reading test edit this file. It would already have
      # been stale -- the link checker joined the set the day it merged.
      #
      # Cost, on this runner: this step took 333 s where the whole-workspace
      # step above takes about 14 minutes, so the fast path still saves about
      # half. (On the development machine the same three figures were 94 s for
      # the crate, 73 s for the targets by name, and 492 s for the workspace;
      # a two-core runner is some 3.5x slower, so compare against the CI
      # numbers, not those.)
      #
      # Doctests are not run below on this path: there are none in the
      # workspace, and none of them would read a documentation file.
      - name: Test the documentation
        if: needs.changes.outputs.docs_only == 'true'
        run: cargo nextest run -p kimmy-api

      # A test that spawns `kimmyd` and fails keeps each node's stdout and
      # stderr here (crates/kimmyd/tests/node_logs). The runner is gone by the
      # time anyone reads a failure, so this is the only copy.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: node-logs-test
          path: ${{ runner.temp }}/node-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Doctests
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test --workspace --doc

  # On pull requests as well as on main, so the harness reports before a
  # merge rather than after it. Skipped for a documentation-only change, which
  # compiles nothing it could exercise.
  cluster:
    name: cluster harness
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    env:
      # Debug info roughly doubles CI build time and nothing here reads a
      # backtrace symbol table.
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -D warnings
      # The harness waits 90 s for a node to answer /healthz, which is generous
      # on a developer's machine and has now timed out three times here on a
      # two-core runner booting three daemons. The tests below already run one
      # at a time, so this is one cluster's startup exceeding the budget rather
      # than jobs contending: the runner is simply slower than the ratio the
      # default was chosen against.
      #
      # Raised rather than removed, and raised only here. A budget that cannot
      # expire would turn a genuine hang into a job that runs until GitHub kills
      # it, which says less than a timeout does. And the failure now prints the
      # node's stderr, so an expiry can be read as a flake or a regression
      # instead of being guessed at -- which is what makes a bigger number
      # headroom rather than a blindfold.
      KIMMY_TEST_PATIENCE_SECS: "240"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Save only from main — see the note on the `lint` job above.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Real kimmyd processes: gossip formation, kill and stall detection,
      # replication through gossip-discovered peers, and webhook ownership
      # across the cluster. Ignored in the default run because each test
      # boots a three-node cluster; serialized because fifteen daemons on a
      # two-core runner prove nothing about timing. This job exists because
      # the two worst cluster bugs shipped while every transport-free test
      # was green — and its first run caught a third.
      - name: Cluster harness
        env:
          KIMMY_TEST_NODE_LOGS: ${{ runner.temp }}/node-logs
        run: cargo test -p kimmyd --test cluster -- --ignored --test-threads=1

      # Every node of a failed cluster test, as the nodes logged it: which
      # peer refused what, and any panic in a connection task. Without it a
      # red harness can only be rerun, not read.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: node-logs-cluster
          path: ${{ runner.temp }}/node-logs
          if-no-files-found: ignore
          retention-days: 14

  # On pull requests as well as on main, like the cluster harness above.
  vector-reachability:
    name: vector reachability
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    env:
      # Debug info roughly doubles CI build time and nothing here reads a
      # backtrace symbol table.
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Save only from main — see the note on the `lint` job above.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A healthy graph at a realistic embedding width must not be mistaken for
      # one that has lost data. Ignored in the default run and released here
      # because a 384-dimensional build is minutes in a debug profile and
      # seconds in release. This job exists because the threshold it guards was
      # sized against a 16-dimensional fixture, held there, and was wrong at
      # every width a real embedding uses — discarding and rebuilding every
      # healthy graph, then reporting it as incomplete.
      #
      # `cargo test --exact` passes having run nothing when the name matches no
      # test, so each of these steps also requires that one test ran and
      # passed. `shell: bash` sets pipefail, so a failed run fails the step
      # through the `tee` as well.
      - name: Reachability at a realistic width
        shell: bash
        run: |
          cargo test -p kimmy-vector --release --lib -- \
            --ignored --exact \
            index::tests::a_healthy_graph_at_a_realistic_width_is_not_rebuilt 2>&1 | tee reachability.log
          grep -q 'test result: ok. 1 passed' reachability.log

      # An open that finds the version vector verified reads a fixed amount of
      # the store, and one that walks reads the oplog (ADR-173's addendum of
      # 2026-09-26). Release only: a debug build of redb reads every allocated
      # page at open, so the difference cannot be metered there. Not ignored in
      # release, so `--include-ignored`.
      - name: A skipping open reads a fixed amount
        shell: bash
        run: |
          cargo test -p kimmy-storage --release --lib -- \
            --include-ignored --exact \
            verified::tests::a_skipping_open_reads_a_fixed_amount_and_a_walking_one_reads_the_oplog 2>&1 | tee skipping-open.log
          grep -q 'test result: ok. 1 passed' skipping-open.log

  # One build of `kimmyd`, shared — and it is the build the release makes.
  #
  # Shared: the docker job puts this binary in the image rather than
  # compiling its own from cold inside BuildKit, where no Rust cache reaches.
  # (The client and conformance jobs that also drove it moved out with the
  # clients, ADR-193.) This job builds once against the warm cache and the
  # docker job downloads the result. The artifact is deleted after a day: it
  # is a hand-off between jobs, not a release.
  #
  # The release's build: the same target, profile, toolchain, RUSTFLAGS and
  # runner as dist's `build-local-artifacts` for x86_64-unknown-linux-musl
  # (ADR-118). That is what makes the cache this job saves readable by a tag —
  # a cache is readable from the ref that wrote it or from the default branch,
  # and this is the only job on main that compiles what a tag compiles. The
  # `shared-key` names the target rather than this job so the differently
  # named job in release.yml restores it (.github/release-build-setup.yml).
  # Every input rust-cache or cargo keys on has to match at both ends, and
  # each is called out below. A mismatch is not a failure, only a cold build,
  # which is what every tag paid before.
  #
  # A side effect the downstream jobs get for free: the binary they test and
  # put in the image is now the static musl binary a release ships, not a
  # glibc one, so the docker smoke test exercises the released kind of file.
  build:
    name: build kimmyd
    # dist's runner for this target (dist-workspace.toml), named rather than
    # `ubuntu-latest` so the two cannot drift apart when the alias moves.
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      # The same action the release setup runs: it installs the current
      # stable — the key hashes the rustc version — and exports `CARGO_HOME`,
      # `CARGO_INCREMENTAL=0` and `CARGO_TERM_COLOR=always`, which the key
      # hashes too.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # What dist installs for this target (`packages_install` in the plan):
      # ring's C code needs a compiler that targets musl.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Save only from main — see the note on the `lint` job above. This step
      # must not see RUSTFLAGS: the release job's copy of it does not either,
      # and the variable is part of the key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-unknown-linux-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Exactly dist's cargo invocation: `--profile dist` (Cargo.toml defines
      # it, so dist uses it), `--workspace` (dist's default, so every
      # dependency is compiled once with the workspace's unioned features),
      # and the RUSTFLAGS dist sets for a musl target, on this step only.
      # Cargo records RUSTFLAGS in every artifact's fingerprint, so a
      # dependency built without them is a dependency the tag rebuilds.
      - name: Build the server
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
        run: cargo build --profile dist --target x86_64-unknown-linux-musl --workspace

      # One file, so the artifact unpacks as `kimmyd` alone.
      - uses: actions/upload-artifact@v7
        with:
          name: kimmyd
          path: target/x86_64-unknown-linux-musl/dist/kimmyd
          if-no-files-found: error
          retention-days: 1

  # The arm64 counterpart, for its cache alone: no job downloads anything
  # from it. It exists so the aarch64-unknown-linux-musl release build starts
  # warm too, on the same terms as the job above — same target, profile,
  # toolchain, RUSTFLAGS and runner as dist's, and a `shared-key` the release
  # setup restores.
  #
  # Gated on the cache lookup, not on the push: rust-cache saves dependency
  # artifacts under a key made of the toolchain, the environment and the
  # lockfile, and it declines to save at all when that exact key already
  # exists. So when the restore is an exact hit, a build here would write
  # nothing new, and the job ends after the restore. It builds when the key
  # is new — a Cargo.lock or Cargo.toml change, a new stable rustc — and when
  # the entry has aged out, which a diff of Cargo.lock could not tell.
  build-arm64:
    name: build kimmyd (arm64)
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # Save only from main — see the note on the `lint` job above.
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-unknown-linux-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # dist's invocation, as in the job above.
      - name: Build the workspace
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Clink-self-contained=yes
        run: cargo build --profile dist --target aarch64-unknown-linux-musl --workspace

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's `prebuilt` stage takes this binary instead of
      # compiling inside BuildKit, which was the single slowest step in CI:
      # `target/` is dockerignored and no Rust cache reaches a BuildKit cache
      # mount, so every push paid a cold release build. The release publish
      # uses the same stage, fed with the binary from the release archive for
      # each architecture (publish-ghcr.yml), so this job also exercises the
      # path a release takes.
      - uses: actions/download-artifact@v8
        with:
          name: kimmyd
          path: .prebuilt
      - run: chmod +x .prebuilt/kimmyd

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kimmydb:ci
          build-args: |
            KIMMYD_SOURCE=prebuilt
          cache-from: type=gha
          # `mode=min`, and only written from main, for the same scoping reason
          # as the Rust cache above: what is worth caching is the base images
          # and the apt layer, which the release publish reads too.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min' || '' }}

      - name: Smoke test the image
        run: |
          # The config validator is the cheapest end-to-end proof that the
          # binary is present, runnable, and correctly wired in the image.
          # Both secrets are supplied because an authenticated node refuses to
          # start -- and `check-config` refuses to bless -- a configuration
          # with no signing key, single node or cluster. The signing key is
          # generated rather than written here: the image binds 0.0.0.0, and
          # off loopback the validator also refuses a key shorter than 32
          # bytes or one of the repository's own placeholder values.
          docker run --rm \
            -e KIMMY_ROOT_PASSWORD=ci-smoke-test \
            -e KIMMY_JWT_SECRET="$(openssl rand -base64 32)" \
            kimmydb:ci check-config
