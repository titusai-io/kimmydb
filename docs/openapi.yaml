openapi: 3.1.0

# KimmyDB's client protocol, written down.
#
# This document is hand-written and checked by a contract test
# (`crates/kimmy-api/tests/openapi.rs`), which fails when the router and this
# file disagree about which operations exist, and when a real response does not
# validate against the schema declared here. See ADR-056 for why it is written
# rather than generated.
#
# Scope: every route `kimmy_api::routes::router` registers. `/mcp` is
# deliberately absent — it is a different protocol (JSON-RPC over streamable
# HTTP, specified by MCP itself), it is gated on `mcp.enabled`, and describing
# it here would put a second, weaker description of it in the repository. See
# `docs/mcp.md`.

info:
  title: KimmyDB HTTP API
  version: 1.0.0
  summary: The client protocol for KimmyDB — HTTP/JSON with WebSocket change streams.
  description: |
    KimmyDB speaks JSON over HTTP. Change streams are a WebSocket. There is no
    second protocol: the MongoDB wire protocol, gRPC and GraphQL were all
    considered and rejected (ADR-011, ADR-055).

    ## Authentication

    `POST /v1/auth/login` exchanges a username and password for a bearer token.
    Every other route except `/healthz`, `/readyz` and `/metrics` requires
    `Authorization: Bearer <token>`.

    A token proves only that this server issued it and that it has not expired.
    Every request re-checks that the account still exists, is not disabled, and
    has not had its sessions revoked since (ADR-052) — so a token stops working
    the moment the account behind it does, without waiting for expiry.

    Tokens expire. `POST /v1/auth/refresh` exchanges a valid one for a fresh
    one, so an application never re-sends credentials while it is using the
    API. It is **not** a way back into a revoked session: the presented token
    goes through the same check every route does, so an account deleted,
    disabled, or whose password or grants changed is refused before refresh
    runs. A client idle past `expiresIn` logs in again.

    ## Encoding: Extended JSON v2

    Documents cross this boundary as JSON using MongoDB's Extended JSON v2
    conventions for the types JSON cannot express. The server accepts either
    plain JSON or the wrapped forms on input, and always emits the wrapped
    forms on output.

    | BSON type | On the wire |
    |---|---|
    | ObjectId | `{"$oid": "507f1f77bcf86cd799439011"}` |
    | Int64 | `{"$numberLong": "9007199254740993"}` |
    | Decimal128 | `{"$numberDecimal": "1.25"}` |
    | DateTime | `{"$date": {"$numberLong": "1700000000000"}}` |
    | Binary | `{"$binary": {"base64": "...", "subType": "00"}}` |

    An integer small enough to be exact in a double may arrive as a plain JSON
    number; a client that round-trips values must preserve the wrapped form it
    was given rather than re-encoding from a parsed float. This is the fidelity
    problem a schema-first protocol would have reintroduced — see ADR-055.

    ## Errors

    Every failure — including a body the server could not parse — is a JSON
    object with a stable `error` code, a human `message`, and a `retry` class.
    The HTTP status carries the class of failure, `error` is what a client
    branches on, and `retry` is what a client library can act on without
    knowing the code at all. Codes are strings rather than numbers on purpose:
    a client's `match` arm reads as what it means.

    ```json
    { "error": "duplicate_key", "message": "duplicate _id", "retry": "no" }
    ```

    `retry` is three-valued — `no`, `wait`, `elsewhere` — because KimmyDB is
    leaderless. Every node accepts writes, so "ask a different node" is a real
    answer here, and it is the right one for a failure local to the node that
    answered. `components.schemas.ErrorCode` is the complete set with the class
    of each; it is closed in the server by an enum, so a code cannot be added
    without its class being decided at the same time.

    **A client should act on `retry` and not on a table of codes it compiled at
    release time.** That is what makes adding a code additive rather than
    breaking.

    ## Every request shape is closed

    A request body with a field the route does not define is refused `422
    bad_request`, and the message names the field and lists the ones the
    route takes (ADR-121). Every request schema below says so with
    `additionalProperties: false`; a document body — insert, replace, bulk —
    is content rather than a shape and takes any field.

    **An explicit `null` on a declared *optional* field is refused `422`
    the same way, rather than read as the field being absent** (ADR-128).
    `Option`-shaped fields — every optional property below — cannot
    otherwise tell "omitted" from "sent as `null`" apart, and the two are
    different requests: `{"if_stamp": null}` is not the same as leaving
    `if_stamp` out, and `{"filter": null, "multi": true}` on `delete` is not
    the same as `{"filter": {}, "multi": true}`, the documented way to match
    every document. Only a request shape's own declared fields are held to
    this — `null` inside a filter, an update operator's operand, or a
    document body is content and untouched. A *required* field sent as
    `null` was already refused before this rule, downstream, by its own
    type — not necessarily at `422` — so this closes the one case nothing
    refused: an optional field's `null`.

    Query strings are held to the same rule, at `400`. On the operations that
    declare a query parameter, one the route does not define, or cannot
    parse, is refused with the parameter named. **On every other operation
    any query string at all is refused `400 bad_request`**, naming the first
    parameter and saying the route takes none (ADR-124) — so `if_stamp`,
    which `update`, `delete` and `find_and_modify` take in the body, can
    never be sent as a query parameter and silently ignored. A bare `?` with
    nothing after it names no parameter and is not refused. `/mcp` is a
    separate transport, outside this rule and outside this document.

    ## Paging

    **A `find` with no `limit` returns at most 100 documents, not all of them.**
    A page is capped at 10,000, and a larger `limit` is *clamped rather than
    refused* — so a client that asks for everything in one request is answered
    with a prefix and no indication that it was one. Walk with a cursor.

    `POST .../find` returns `nextCursor` whenever the page filled, `skip` is
    `0`, and the query is one a cursor can continue. A query a cursor cannot
    continue — and a page reached by a non-zero `skip`, which is an offset
    rather than a walk — returns no token at all, rather than one that would
    silently page in a different order than the one asked for.

    What a client may rely on:

    - **The token is opaque.** Do not parse, compare or construct one. It
      encodes a document key, and that encoding may change.
    - **It is portable across nodes.** It carries no server state and no node
      identity, so a client may send it to any node in the cluster.
      Verified on a real cluster, not only argued from the design.
    - **Paging never repeats a document, and never misses one that was present
      and unchanged for the whole walk.** That is stronger than `skip`, where a
      delete behind the offset shifts every later page.
    - **It is not a snapshot.** A document inserted with an `_id` *after* the
      cursor appears on a later page; one inserted *before* it does not. Both
      follow from the token being a position in `_id` order.
    - **The token belongs to a position, not to a query.** Sending it with a
      different filter resumes that filter after the same key; the server does
      not check that it came from the query it is being used with.
    - **A token does not expire**, and nothing on the server holds it. There is
      no session to keep alive and none to lose.

    ## Versioning

    **The path carries the major version, and `/v1` does not break.** Adding a
    route, an optional request field, a response field, an error code, or a
    value to an enum a client is told to tolerate is additive and ships without
    ceremony. Anything that would break a correct `/v1` client mints `/v2`,
    served alongside `/v1` for a stated window.

    `GET /v1/version` reports the protocol version, the build, the node that
    answered, and a **capability list** — which is what a client should branch
    on, because during a rolling upgrade the node answering the next request
    may be older than the one that answered the last.

    [Compatibility](compatibility.md) is the whole policy: what counts as
    additive, what forces `/v2`, what a client must tolerate to be considered
    correct, and what a node does with a request from a newer client.

servers:
  - url: http://localhost:7878
    description: A node's default HTTP address.

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness, readiness and metrics. Unauthenticated so a load balancer needs no credentials.
  - name: auth
    description: Obtaining a token and inspecting the principal behind it.
  - name: users
    description: Server-wide user administration. Requires `admin` over `*`.
  - name: roles
    description: |
      Named sets of grants, shared by local users and by federated principals
      whose claim maps to one. Requires `admin` over `*`, because whoever may
      edit a role may hand out everything it names.
  - name: collections
    description: Databases, collections and their metadata.
  - name: documents
    description: Reading and writing documents.
  - name: indexes
    description: Secondary indexes, including unique, TTL and partial ones.
  - name: vectors
    description: Embedding configuration, client-supplied vectors, and search.
  - name: webhooks
    description: Push delivery of change events to an HTTP endpoint.
  - name: streaming
    description: Change streams over WebSocket.
  - name: admin
    description: Node-level operations.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness.
      description: Answers as long as the process is serving. Says nothing about storage.
      security: []
      responses:
        "200":
          description: The node is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
        "400": { $ref: "#/components/responses/BadRequest" }

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness.
      description: |
        Proves the storage engine responds, so a node with a wedged database is
        taken out of rotation rather than served. Also the cheapest way for a
        client to learn which node it reached.
      security: []
      responses:
        "200":
          description: The node is serving and storage responds.
          content:
            application/json:
              schema:
                type: object
                required: [status, node]
                properties:
                  status:
                    const: ready
                  node:
                    type: string
                    description: This node's id.
        "400": { $ref: "#/components/responses/BadRequest" }

  /metrics:
    get:
      tags: [health]
      operationId: metrics
      summary: Prometheus metrics.
      description: |
        Deliberately limited to counts. Collection *names* are not exposed here
        — that would leak the schema to anything that can reach the port.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }

  /.well-known/oauth-protected-resource:
    get:
      tags: [auth]
      operationId: protectedResourceMetadata
      summary: This node, as an OAuth 2.0 protected resource (RFC 9728).
      description: |
        Published when the node federates with an identity provider **and**
        `auth.oidc.audience` is written as an `https` URL — which is what gives
        the node a name an authorization server knows it by.

        Unauthenticated by necessity: a client holding no token is exactly who
        needs it. It names both the resource identifier to request a token for
        (the RFC 8707 `resource` parameter) and the authorization server to
        request it from, so `kimmy login` needs nothing but the node URL.
        It is also how a conformant MCP client discovers where to authenticate.

        `scopes_supported` is deliberately absent: authorization here is roles
        carried in the token, not scopes.

        404 when the audience is an opaque string rather than an https URL — a
        supported configuration with nothing truthful to publish.
      security: []
      responses:
        "200":
          description: The node's protected resource metadata.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers]
                properties:
                  resource:
                    type: string
                    format: uri
                    description: This node's resource identifier.
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                    description: >-
                      The issuer this node trusts. Exactly one entry: a second
                      issuer is a second trust root (ADR-064).
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Always `["header"]`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: This node publishes no protected resource metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /.well-known/oauth-protected-resource/{resource_path}:
    get:
      tags: [auth]
      operationId: protectedResourceMetadataAtPath
      summary: The same document, for a resource identifier that has a path.
      description: |
        RFC 9728 §3 inserts the well-known segment between the host and the
        path, so a resource identifier of `https://host/nodes/one` publishes at
        `/.well-known/oauth-protected-resource/nodes/one`. Any other suffix is
        a 404 rather than this node's document — answering for a resource that
        is not this one would be a lie a client acts on.
      security: []
      parameters:
        - name: resource_path
          in: path
          required: true
          schema:
            type: string
          description: The path component of this node's resource identifier.
      responses:
        "200":
          description: The node's protected resource metadata.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers]
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Not this node's resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a bearer token.
      description: |
        Rate-limited per source address and per username, and the limit is
        checked *before* the password is verified: every attempt costs a full
        Argon2id verification, including for a user that does not exist, which
        is what stops timing from revealing whether one does (ADR-038).

        Only failed attempts count against the limit.

        Where this route answers at all is `auth.local.login` (ADR-100):
        `always` (the default), `loopback_only`, or `disabled`. The mode
        governs the *minting* of local tokens — a token already issued keeps
        verifying under every mode, and federated tokens are unaffected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user, password]
              properties:
                user:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Wrong password, or no such user. The two are indistinguishable by
            design — body and status are identical.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            `auth.local.login` is `loopback_only` and the connection's TCP peer
            is not a loopback address. The `forbidden` code; the message names
            the setting. Judged on the socket peer, never on a forwarded
            header, so a reverse proxy on the node's own host looks local. Log
            in from the host, or through the identity provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            `auth.local.login` is `disabled`: this node mints no local tokens
            for anyone, and only its identity provider can authenticate a
            caller. Not retryable from elsewhere.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/version:
    get:
      tags: [health]
      operationId: version
      summary: What this node is, and what it can do.
      description: |
        **Ask this before assuming a feature exists.** A client fails over
        between nodes, so during a rolling upgrade the node answering the next
        request can be older than the one that answered the last. `capabilities` is what a client should
        branch on — a version number only answers the question if the client
        also carries a table mapping versions to features, which is the table
        this endpoint replaces.

        Unauthenticated, because a client must be able to negotiate before it
        holds a token. It names no database, collection or user.
      security: []
      responses:
        "200":
          description: This node's protocol version, build, identity and capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [protocol, version, commit, node, capabilities]
                properties:
                  protocol:
                    type: string
                    description: |
                      The protocol major version, matching the path prefix
                      every versioned route carries.
                    const: v1
                  version:
                    type: string
                    description: |
                      The build version. For operators; a client should branch
                      on `capabilities` instead.
                  commit:
                    type: string
                    description: |
                      The short git commit the build was made from, or
                      `unknown` for a build made without git — a source
                      tarball builds too. For operators, like `version`:
                      it names the exact build when two nodes in a
                      half-upgraded cluster claim the same version.
                  node:
                    type: string
                    description: The node that answered.
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }
                  durability:
                    type: string
                    enum: [durable, coalesced]
                    description: |
                      How this node makes a commit durable (ADR-088). Both
                      classes are durable when a write's response returns;
                      `coalesced` shares one fsync among concurrent writers
                      at the cost of a few milliseconds of latency. A fact
                      about configuration rather than build, so a field
                      rather than a capability.
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a valid token for a fresh one.
      description: |
        Sliding re-issue: the request carries the current token in the usual
        `Authorization` header and carries no body. The new token is built from
        a fresh read of the user record, so grants and validity come from
        storage rather than from the old token's claims.

        **This cannot revive a revoked session.** The presented token is
        checked exactly as it would be on any other route — signature, expiry,
        and the storage read that makes deletion, disabling and a version bump
        take effect immediately. A token refused there never reaches this
        route.

        **The old token keeps working until it expires.** Refreshing does not
        recall it; a stateless token cannot be recalled. To end a session
        before its expiry, change the account's password or grants, or delete
        it — each bumps the token version and invalidates every token the user
        holds.

        Not rate-limited: there is no password verification here, which is what
        the login limiter exists to bound.

        Bound by `auth.local.login` exactly as `/v1/auth/login` is, because
        this mints a local token too (ADR-100). The mode is checked before the
        token, so under `disabled` every caller sees the 404.
      responses:
        "200":
          description: A fresh token, with the same authority the account has now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "400":
          description: |
            The node runs with authentication disabled, so there is no token to
            refresh.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `auth.local.login` is `loopback_only` and the connection's TCP peer
            is not a loopback address. The `forbidden` code. The presented
            token is still valid everywhere; only its renewal is confined to
            the host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            `auth.local.login` is `disabled`: this node mints no local tokens.
            Answered before the token is examined, so a missing or expired
            token gets this rather than a 401.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/topology:
    get:
      tags: [health]
      operationId: topology
      summary: The nodes a client may use.
      description: |
        **Every node accepts writes**, so client-side node selection here is
        sticky plus retry elsewhere: a client keeps using the node that last
        answered and moves only when one stops answering. There is no primary to
        funnel through, and none of the machinery a driver needs to find one.
        This endpoint gives a client somewhere to go, not a rotation to follow.

        Two sources, because neither answers alone. The **address** of a node
        comes from a replicated registry each node writes itself into;
        **liveness** comes from SWIM membership. So `endpoint` says where, and
        `status` says whether this node currently sees it.

        `status` is `live` or `unknown`, never `down`: a node whose gossip is
        partitioned while its HTTP is perfectly reachable is a real state in a
        leaderless cluster, and `unknown` is the honest word for "this node has
        not heard from it". A client may still try one — a failed request costs
        one round trip, and `retry: elsewhere` already covers it.

        **The answering node always appears, marked `self`, and first.** A
        client reading the list top-down should not be moved off the node
        already serving it.

        A node that has not been told what to advertise appears with a null
        `endpoint`. That happens when it binds a wildcard address and no
        `server.advertise` is configured — a node guessing its own address
        would publish a wrong one to every client in the cluster.

        Authenticated, unlike `/v1/version`: a version is a fact about
        software, and this is a map of where a deployment's data lives.
      responses:
        "200":
          description: Every node this one knows about.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, count]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
                  count:
                    type: integer
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/whoami:
    get:
      tags: [auth]
      operationId: whoami
      summary: The principal behind the token, and what it may do.
      responses:
        "200":
          description: The authenticated principal.
          content:
            application/json:
              schema:
                type: object
                required: [user, display, grants, authenticated, federated]
                properties:
                  user:
                    type: string
                    description: |
                      The identity: a local user name, or a federated token's
                      `sub`. Everything the server decides is decided on this.
                  display:
                    type: string
                    description: |
                      A readable name beside the identity, never instead of it
                      (ADR-100). For a federated caller, the string value of
                      the claim `auth.oidc.subject_claim` names —
                      `preferred_username`, `email`, `upn` — falling back to
                      `user` when the claim is unset, absent from the token,
                      or not a string. For a local caller, always `user`.
                      Presentation only: an email is mutable and not unique
                      across providers, so nothing keys on it, and a client
                      should not either.
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
                  authenticated:
                    type: boolean
                    description: |
                      False only on a node started with `--insecure-no-auth`,
                      where every caller is an unauthenticated superuser.
                  federated:
                    type: boolean
                    description: |
                      True when the identity came from the external OIDC
                      provider rather than this cluster's user store. A name
                      does not answer this — a provider may assert a subject
                      matching a local account — and a federated principal has
                      no local record, so it cannot change a password or be
                      revoked from here.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: |
            The name of every user on the node. Names only — grants come from
            `GET /v1/users/{name}`, and a password hash is never served at all.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user, password]
              properties:
                user:
                  type: string
                password:
                  type: string
                  minLength: 8
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [user, grants]
                properties:
                  user:
                    type: string
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A user of that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/users/{name}:
    parameters:
      - $ref: "#/components/parameters/UserName"
    get:
      tags: [users]
      operationId: getUser
      summary: One user.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user.
      description: |
        Refused for the last remaining user, and for the account the caller is
        signed in as. Deleting revokes the account's live tokens on this node
        immediately; other nodes drop them as the change replicates.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: Deleted, or no such user.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The last user, or the caller's own account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/users/{name}/password:
    parameters:
      - $ref: "#/components/parameters/UserName"
    post:
      tags: [users]
      operationId: setPassword
      summary: Set a password.
      description: |
        A user may always change their own password; changing anyone else's
        requires `admin` over `*`. Either way the account's existing tokens
        stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{name}/disabled:
    parameters:
      - $ref: "#/components/parameters/UserName"
    post:
      tags: [users]
      operationId: setDisabled
      summary: Disable or re-enable an account.
      description: |
        A disabled account is refused at authentication while its record stays
        in place, and the bump to its token version ends every session it
        holds; re-enabling does not restore those sessions. Refused for the
        caller's own account and for the last remaining enabled user, for the
        same reasons deletion is.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [updated, disabled]
                properties:
                  updated: { type: string }
                  disabled: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/users/{name}/grants:
    parameters:
      - $ref: "#/components/parameters/UserName"
    post:
      tags: [users]
      operationId: setGrants
      summary: Replace a user's grants.
      description: The whole set, not a delta. Existing tokens are re-evaluated against the new grants.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/users/{name}/roles:
    parameters:
      - $ref: "#/components/parameters/UserName"
    post:
      tags: [roles]
      operationId: setUserRoles
      summary: Replace the roles a user holds.
      description: |
        The whole set, not a delta. Role grants are **added to** the user's
        direct grants rather than replacing them: effective permission is the
        union of the two. The account's existing tokens stop working, because a
        user's grants are resolved at login and embedded in its token.

        A name that matches no role is accepted, not refused — it simply grants
        nothing. Roles and users are administered independently, so refusing
        would make the order of two unrelated operations load-bearing.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Updated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: |
            The name of every role on the node. Names only — grants come from
            `GET /v1/roles/{name}`.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [role, grants]
                properties:
                  role:
                    type: string
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A role of that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/roles/{name}:
    parameters:
      - $ref: "#/components/parameters/RoleName"
    get:
      tags: [roles]
      operationId: getRole
      summary: One role.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: The role and its grants.
          content:
            application/json:
              schema:
                type: object
                required: [role, grants]
                properties:
                  role:
                    type: string
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [roles]
      operationId: deleteRole
      summary: Delete a role.
      description: |
        Holders keep the role's *name* on their record, where it resolves to
        nothing. That is deliberate: the alternative is rewriting every user
        record on a delete, and a name that grants nothing is the safe direction
        to fail in.

        Every holder's live tokens are revoked, and `invalidated` reports how
        many accounts that was.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: Deleted, or no such role.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, invalidated]
                properties:
                  deleted:
                    type: boolean
                  invalidated:
                    type: integer
                    description: How many accounts had their tokens revoked.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/roles/{name}/grants:
    parameters:
      - $ref: "#/components/parameters/RoleName"
    post:
      tags: [roles]
      operationId: setRoleGrants
      summary: Replace a role's grants.
      description: |
        The whole set, not a delta.

        Every holder's live tokens are revoked, and `invalidated` reports how
        many accounts that was. Without it a *narrowing* edit would take effect
        only as each holder's token expired. Federated principals need no such
        revocation and are not counted: their grants are resolved from this
        store on every request, so the edit already applies to them.
      x-kimmy-action: admin over `*`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grants]
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                type: object
                required: [updated, invalidated]
                properties:
                  updated:
                    type: string
                  invalidated:
                    type: integer
                    description: How many accounts had their tokens revoked.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/databases:
    get:
      tags: [collections]
      operationId: listDatabases
      summary: List databases.
      description: Filtered by grant — a database the caller cannot read is not named.
      x-kimmy-action: read (filtered)
      responses:
        "200":
          description: The visible databases.
          content:
            application/json:
              schema:
                type: object
                required: [databases]
                properties:
                  databases:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/db/{db}/collections:
    parameters:
      - $ref: "#/components/parameters/Db"
    get:
      tags: [collections]
      operationId: listCollections
      summary: List collections in a database.
      description: |
        Filtered by grant. A database that exists but in which the caller can
        read nothing lists as `[]`; a database that does not exist is a 404,
        so a mistyped name is not mistaken for an empty one.
      x-kimmy-action: read (filtered)
      responses:
        "200":
          description: The visible collections.
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [collections]
      operationId: createCollection
      summary: Create a collection.
      x-kimmy-action: ddl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    A leading `__` is reserved for system collections and is
                    refused here.
      responses:
        "200":
          description: |
            Created. **Creating one that already exists is a `409`**, not a
            second success — so a caller that wants "make sure this exists"
            treats `conflict` as the good case rather than assuming the call is
            idempotent.
          content:
            application/json:
              schema:
                type: object
                required: [created, id]
                properties:
                  created:
                    type: string
                  id:
                    type: integer
                    description: |
                      The collection id, derived from `(database, name)` so
                      every node in a cluster computes the same value.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A collection of that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/db/{db}:
    parameters:
      - $ref: "#/components/parameters/Db"
    delete:
      tags: [collections]
      operationId: dropDatabase
      summary: Drop every collection in a database.
      description: >-
        Each collection is dropped in turn as its own replicated change; the
        last drop removes the database from listings on every member.
        Databases are otherwise implicit — created by their first collection,
        removed with their last. System databases (`__…`) are refused.
      x-kimmy-action: ddl
      responses:
        "200":
          description: Dropped, or there was nothing to drop.
          content:
            application/json:
              schema:
                type: object
                required: [dropped]
                properties:
                  dropped:
                    type: boolean
        "400":
          description: A system database.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/db/{db}/coll/{coll}:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    delete:
      tags: [collections]
      operationId: dropCollection
      summary: Drop a collection and everything in it.
      x-kimmy-action: ddl
      responses:
        "200":
          description: Dropped, or there was nothing to drop.
          content:
            application/json:
              schema:
                type: object
                required: [dropped]
                properties:
                  dropped:
                    type: boolean
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/db/{db}/coll/{coll}/describe:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [collections]
      operationId: describeCollection
      summary: Inferred shape of a collection.
      description: |
        **Inference, not a schema.** Nothing here is enforced, and `presence`
        is a fraction of the *sampled* documents rather than of the collection.
        A field absent from the sample is not a field the collection may not
        contain.
      x-kimmy-action: read
      parameters:
        - name: sample
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: |
            Documents to sample. Defaults to 100. `0` is refused `400`
            naming the parameter; a value above 1000 is clamped to 1000, and
            `sampled` in the answer is how many were actually read.
        - name: examples
          in: query
          required: false
          schema: { type: boolean }
          description: |
            Include one example value per field. An example is always a
            *BSON* scalar, so a date, an ObjectId or a binary value appears
            in its Extended JSON form and a field holding only objects,
            arrays or `null` carries none. A field whose every sampled value
            is a string over 120 bytes carries none either: the key is
            absent, not `null`.
      responses:
        "200":
          description: The inferred shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionDescription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/docs:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Read documents without a filter.
      description: |
        The convenience form. Anything with a filter, sort, projection or
        cursor goes to `POST .../find`, because a query belongs in a body
        rather than in a URL.
      x-kimmy-action: read
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 100 }
          description: |
            Defaults to 100 and is clamped to 10,000 — the same as `find`. This
            route takes no cursor; paging goes through `POST .../find`.
        - name: skip
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [documents]
      operationId: insertDocument
      summary: Insert one document.
      description: |
        An absent `_id` is assigned. A duplicate `_id`, or a value that would
        break a unique index, is refused with `409`.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: Inserted, and durable.
          content:
            application/json:
              schema:
                type: object
                required: [insertedId]
                properties:
                  insertedId: {}
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: The version the insert produced.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/db/{db}/coll/{coll}/bulk:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: bulkInsert
      summary: Insert many documents in one commit.
      description: |
        **All or nothing.** One transaction, one commit, and a failure anywhere
        aborts the whole batch — no document lands, no event is published, and
        the version vector does not move. That includes conflicts *within* the
        batch: two documents sharing an `_id`, or colliding on a unique index,
        fail it.

        This is the throughput path. The commit is the cost, not the encoding,
        so batching is worth roughly two orders of magnitude over inserting one
        at a time.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: Every document landed.
          content:
            application/json:
              schema:
                type: object
                required: [inserted, insertedIds, stamps]
                properties:
                  inserted:
                    type: integer
                  insertedIds:
                    type: array
                    items: {}
                  stamps:
                    type: array
                    items: { $ref: "#/components/schemas/Stamp" }
                    description: |
                      The version each document landed at, positionally
                      parallel to `insertedIds` — what `insert` reports as
                      `stamp`, once per document.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Nothing was written. The message names the offending document's
            position in the batch, which is the only thing that can point at
            what to fix — there is no partial result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/db/{db}/coll/{coll}/find:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: find
      summary: Query a collection.
      x-kimmy-action: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindRequest" }
      responses:
        "200":
          description: A page of documents, with a continuation token when one applies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FindResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/count:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: count
      summary: Count matching documents.
      description: |
        The body is the `find` shape, and a count reads `filter` and
        `explain` from it; the rest — `limit` included — is accepted and
        ignored. A count is of every match and is never a page: there is no
        cap, because a count that stopped early would be a wrong number
        rather than a short list.
      x-kimmy-action: read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindRequest" }
      responses:
        "200":
          description: The number of matches.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                  explain: { $ref: "#/components/schemas/Explain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/aggregate:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: aggregate
      summary: Run an aggregation pipeline.
      description: See `docs/aggregation.md` for the stages and expression operators.
      x-kimmy-action: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pipeline]
              properties:
                pipeline:
                  type: array
                  items: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: The pipeline's output.
          content:
            application/json:
              schema:
                type: object
                required: [documents, count]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  count:
                    type: integer
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/update:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: update
      summary: Update matching documents.
      description: |
        The operators run **inside the write transaction**, on the image it
        holds, so concurrent updates to one document all land (ADR-083). A
        `multi: true` request commits in chunks of `storage.multi_chunk_docs`
        documents (default 1,000), releasing the writer between chunks; each
        chunk is all or none, and a failure in a later chunk leaves the
        earlier ones committed — `commits` says how many landed (ADR-086).

        With `if_stamp`, the write happens only if the matched document is
        at that version; otherwise `409 stale` and nothing is written
        (ADR-084). Single-document only: a stamp names one document.

        An update path may address array elements: `items.$[].qty` reaches
        every element, and `items.$[line].qty` reaches the elements the
        `arrayFilters` entry for `line` selects (ADR-104).

        **`explain: true` plans the update; it does not perform it**
        (ADR-131). It answers with the same plan a real update would use —
        `documentsExamined`, `documentsMatched`, and which index, if any —
        but writes nothing and spends no commit: `matched`, `modified` and
        `commits` all report zero, and `stamp` is absent, exactly as they
        would for a write that touched nothing. What the update *would*
        touch is `explain.documentsMatched` — but that count is the
        selection, not a guarantee: `explain` never runs the update
        operators, so the real write can still refuse a document it counted,
        if an operator cannot apply to that document (a `$inc` on a
        non-numeric field, say). Cannot be combined with `if_stamp`: a plan
        checks no version, so it cannot answer whether a conditional update
        would happen.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update]
              properties:
                filter: { $ref: "#/components/schemas/Document" }
                update:
                  $ref: "#/components/schemas/Document"
                  description: Update operators, or a whole replacement document.
                multi:
                  type: boolean
                  default: false
                explain:
                  type: boolean
                  default: false
                  description: |
                    Plan the update and report the plan, without performing
                    it. See the route description.
                if_stamp:
                  allOf: [{ $ref: "#/components/schemas/Stamp" }]
                  description: |
                    Write only if the matched document is at this stamp.
                    Cannot be combined with `multi`, or with `explain` — a
                    plan checks no version, so it cannot answer whether a
                    conditional write would happen (ADR-131). `400` either
                    way.
                arrayFilters:
                  $ref: "#/components/schemas/ArrayFilters"
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                type: object
                required: [matched, modified]
                properties:
                  matched:
                    type: integer
                    description: |
                      Documents the filter matched and the write acted on.
                      Zero under `explain: true`, which plans and does not
                      act on anything — see `explain.documentsMatched` for
                      the selection the plan found, which the write may
                      still refuse a document out of if an operator cannot
                      apply to it (ADR-131).
                  modified:
                    type: integer
                    description: |
                      Documents **written**, not documents changed — so this
                      equals `matched`. Every match is written back whether or
                      not the operators moved anything: a `$set` to the value a
                      field already holds still counts, as does an `$unset` of
                      a field that was never there.

                      **MongoDB's `nModified` means the other thing**, and
                      excludes those, so a client ported from it gets a number
                      that looks right and is not. To ask "did anything
                      change?", compare `matched` against a `count` filtered on
                      the state you want. See
                      [Deviations](deviations.md).
                  commits:
                    type: integer
                    description: |
                      Write transactions the request cost — one per chunk of
                      `storage.multi_chunk_docs` documents, zero when nothing
                      matched (ADR-086) and zero under `explain: true`, which
                      spends none (ADR-131).
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: |
                      The version the write produced. Present only when the
                      request wrote exactly one document without `multi` — a
                      version names one document, and a multi write has no
                      single one to name (ADR-084). Always absent under
                      `explain: true`, which writes nothing (ADR-131).
                  explain: { $ref: "#/components/schemas/Explain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/db/{db}/coll/{coll}/find_and_modify:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: findAndModify
      summary: Find one document and update or remove it, atomically.
      description: |
        The match happens *inside* the write transaction. Storage has a single
        writer, so a document found inside the write cannot be taken by anyone
        else before the commit — atomic by construction, with no retry loop and
        no client-visible contention.

        The candidate set is bounded. A filter matching more than 10,000
        documents is **refused** rather than answered from a prefix, which
        would return a document the sort did not pick.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                filter: { $ref: "#/components/schemas/Document" }
                sort:
                  $ref: "#/components/schemas/Document"
                  description: |
                    Chooses which document when several match. Without it the
                    choice is the scan's own order, which is unspecified.
                update: { $ref: "#/components/schemas/Document" }
                remove:
                  type: boolean
                  default: false
                upsert:
                  type: boolean
                  default: false
                returnDocument:
                  type: string
                  enum: [before, after]
                  default: before
                projection: { $ref: "#/components/schemas/Document" }
                if_stamp:
                  allOf: [{ $ref: "#/components/schemas/Stamp" }]
                  description: |
                    Change the chosen document only if it is at this stamp;
                    otherwise `409 stale`. Cannot be combined with `upsert`.
                arrayFilters:
                  $ref: "#/components/schemas/ArrayFilters"
      responses:
        "200":
          description: |
            The chosen document, before or after the change as asked. `document`
            is null when nothing matched.
          content:
            application/json:
              schema:
                type: object
                required: [document, matched]
                properties:
                  document:
                    oneOf:
                      - $ref: "#/components/schemas/Document"
                      - type: "null"
                  matched:
                    type: integer
                  upsertedId: {}
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: |
                      The version the write produced. Absent when nothing was
                      written, and after a removal — nothing can be
                      conditional on a document that is gone.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/db/{db}/coll/{coll}/delete:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [documents]
      operationId: deleteDocuments
      summary: Delete matching documents.
      description: |
        Like `update`: matched and tombstoned inside the write transaction,
        `multi: true` commits in chunks of `storage.multi_chunk_docs` with the
        writer released between them, and `if_stamp` makes a single-document
        delete conditional on its version.

        **`explain: true` plans the delete; it does not perform it**
        (ADR-131). `deleted` and `commits` report zero and `stamp` is absent,
        exactly as they would for a delete that matched nothing; what it
        *would* delete is `explain.documentsMatched`. Cannot be combined
        with `if_stamp`: a plan checks no version, so it cannot answer
        whether a conditional delete would happen.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                filter: { $ref: "#/components/schemas/Document" }
                multi:
                  type: boolean
                  default: false
                explain:
                  type: boolean
                  default: false
                  description: |
                    Plan the delete and report the plan, without performing
                    it. See the route description.
                if_stamp:
                  allOf: [{ $ref: "#/components/schemas/Stamp" }]
                  description: |
                    Delete only if the matched document is at this stamp.
                    Cannot be combined with `multi`, or with `explain` — a
                    plan checks no version, so it cannot answer whether a
                    conditional delete would happen (ADR-131). `400` either
                    way.
      responses:
        "200":
          description: How many were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    description: |
                      Documents deleted. Zero under `explain: true`, which
                      plans and does not delete — see
                      `explain.documentsMatched` for what would have been
                      deleted (ADR-131).
                  commits:
                    type: integer
                    description: |
                      Write transactions the request cost — one per chunk
                      (ADR-086), zero under `explain: true` (ADR-131).
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: |
                      The tombstone's version. Present only when the request
                      deleted exactly one document without `multi` (ADR-084).
                      Always absent under `explain: true`.
                  explain: { $ref: "#/components/schemas/Explain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/docs/{id}:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
      - $ref: "#/components/parameters/DocId"
    get:
      tags: [documents]
      operationId: getDocument
      summary: Read one document by `_id`.
      description: |
        The point path. `find` with a filter on `_id` takes the same primary-key
        path, so either works when the id is known; this one needs no body and
        answers with the document alone.
      x-kimmy-action: read
      responses:
        "200":
          description: |
            The document, exactly as stored. Its version travels as the
            `ETag` rather than as a field: pass the tag's value (without
            the quotes) as `if_stamp` on a following write.
          headers:
            ETag:
              schema: { type: string }
              description: The document's stamp, quoted as an entity tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [documents]
      operationId: replaceDocument
      summary: Replace one document by `_id`.
      description: |
        **Without `?upsert=true` a missing document is not an error.** The
        response is `200 {"matched": 0}` and nothing is written. A test built
        on the assumption that this creates the document writes nothing and
        passes.
      x-kimmy-action: write
      parameters:
        - name: upsert
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Insert the document when no existing one matches.
        - name: if_stamp
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Stamp" }
          description: |
            Replace only if the document is at this stamp; otherwise
            `409 stale` and nothing is written. A missing document is stale
            too, `upsert` or not — the condition says "at this version",
            not "or create it".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "200":
          description: |
            What happened. `matched` is 0 when nothing was there and `upsert`
            was not asked for.
          content:
            application/json:
              schema:
                type: object
                required: [matched, modified, upserted]
                properties:
                  matched:
                    type: integer
                    enum: [0, 1]
                    description: |
                      A count, as on `/update` and `/find_and_modify`, though a
                      replace touches at most one document. One concept, one
                      type, across every route that reports a write.
                  modified:
                    type: integer
                    enum: [0, 1]
                  upserted:
                    type: boolean
                    description: Genuinely a yes/no, so it stays one.
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: The version the write produced. Absent when nothing was written.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete one document by `_id`.
      x-kimmy-action: write
      parameters:
        - name: if_stamp
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Stamp" }
          description: |
            Delete only if the document is at this stamp; otherwise
            `409 stale` and nothing is written.
      responses:
        "200":
          description: |
            1 if a document was deleted, 0 if there was none — a count, not
            an error either way. When one was, `stamp` is the tombstone's
            version, as every write reports the version it produced
            (ADR-084).
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    enum: [0, 1]
                  stamp:
                    allOf: [{ $ref: "#/components/schemas/Stamp" }]
                    description: |
                      The tombstone's version — what `POST .../delete` of one
                      document reports. Present exactly when `deleted` is 1.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/violations:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [indexes]
      operationId: listViolations
      summary: Unique-index violations still standing on a collection.
      description: |
        Uniqueness is enforced on the accepting node and only *detected* across
        nodes, after the fact, when a replicated write is merged (ADR-029). Each
        detection is a `uniqueViolation` change-stream event and a count on
        `/metrics`; this route is the resolution side — which violations still
        stand *now*. Each recorded collision is re-evaluated against the
        documents as they are: a member that has been deleted, or whose value
        has been rewritten so that its index keys no longer meet another
        member's, is left out of its group, and a group with fewer than two
        members left is not reported (ADR-087).

        Without `index`, a count per index. With `index`, the colliding groups
        on that index with their documents, at most 10,000 groups.

        **Cost.** The report is derived from the retained oplog, so a call is
        one pass over it: every retained entry's header, whatever collection
        wrote it. It grows with `storage.oplog_retention_secs` and the node's
        write rate, not with this collection, and a collision older than the
        retention window is no longer reported. A collection with no unique
        index, or an `index` that is not one of its unique indexes, is answered
        without the pass. Call it to resolve what a `uniqueViolation` event
        announced rather than on a timer.
      x-kimmy-action: read
      parameters:
        - name: index
          in: query
          required: false
          schema: { type: string }
          description: Return the colliding groups on this index rather than counts.
      responses:
        "200":
          description: Counts per index, or the groups on one index.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [count, indexes]
                    properties:
                      count:
                        type: integer
                        description: Violations standing across every index.
                      indexes:
                        type: array
                        items:
                          type: object
                          required: [name, count]
                          properties:
                            name: { type: string }
                            count: { type: integer }
                  - type: object
                    required: [index, count, groups]
                    properties:
                      index: { type: string }
                      count: { type: integer }
                      groups:
                        type: array
                        items: { $ref: "#/components/schemas/ViolationGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/indexes:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [indexes]
      operationId: listIndexes
      summary: List the indexes on a collection.
      x-kimmy-action: read
      responses:
        "200":
          description: The indexes.
          content:
            application/json:
              schema:
                type: object
                required: [indexes]
                properties:
                  indexes:
                    type: array
                    items: { $ref: "#/components/schemas/Index" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [indexes]
      operationId: createIndex
      summary: Create an index.
      description: |
        The backfill is blocking: the response means the index is built and
        usable, not scheduled.

        On a clustered node the response also means every live member has
        applied or refused the definition: the change is pushed to each
        member and the request waits for their answers, so a client that
        creates an index here and writes through a front a moment later
        finds it enforced wherever the write lands. `confirmation` names
        each member's answer; a member listed under `pending` did not answer
        within `cluster.ddl_confirm_timeout_secs` and receives the change
        through anti-entropy as before (ADR-140). A node without peers
        answers with no `confirmation` at all.

        `expireAfterSeconds` makes it a TTL index — single-field and
        dates-only, and a document whose indexed field holds anything else is
        never expired. `partialFilterExpression` makes it partial, and the
        filter language is deliberately bounded (`$exists: true`, equality,
        `$gt`/`$gte`/`$lt`/`$lte`, and conjunction) so that "does this query
        provably fall inside the index" is a decision rather than a guess.
        Anything outside that language is refused here rather than producing an
        index that silently answers with a subset.
      x-kimmy-action: ddl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  description: |
                    An array rather than a `{field: 1}` object, deliberately:
                    field order decides which queries a compound index can
                    answer, and JSON object key order is not something a client
                    can rely on surviving serialization.
                  items:
                    type: object
                    additionalProperties: false
                    required: [path]
                    properties:
                      path:
                        type: string
                      descending:
                        type: boolean
                        default: false
                unique:
                  type: boolean
                  default: false
                name:
                  type: string
                  description: Derived from the fields when absent.
                enforcement:
                  type: string
                  enum: [local, coordinated]
                  default: local
                expireAfterSeconds:
                  type: integer
                  description: Makes this a TTL index.
                partialFilterExpression:
                  $ref: "#/components/schemas/Document"
                  description: Makes this a partial index.
      responses:
        "200":
          description: |
            The index, built and in use — and, on a clustered node, confirmed
            on every live member that answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Index" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Existing documents break a unique constraint the index would impose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/db/{db}/coll/{coll}/indexes/{name}:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
      - $ref: "#/components/parameters/IndexName"
    delete:
      tags: [indexes]
      operationId: dropIndex
      summary: Drop an index.
      description: |
        A drop is an instruction to the cluster, not a report on the member
        that answers: it is recorded and replicated whether or not that
        member holds the index, so a drop issued through a front that spreads
        requests across members removes the index wherever it stands
        (ADR-141). `dropped` says whether *this* member held it and removed
        it. On a clustered node the drop is also pushed to every live member
        before the response, as `createIndex` is, and `confirmation` says
        who applied it (ADR-140). A name a create would refuse is refused
        here too, with `400`, before anything is recorded.
      x-kimmy-action: ddl
      responses:
        "200":
          description: |
            The drop is recorded and replicating. `dropped` says whether this
            member held the index.
          content:
            application/json:
              schema:
                type: object
                required: [dropped]
                properties:
                  dropped:
                    type: boolean
                    description: |
                      Whether this member held the index and removed it. `false`
                      does not mean nothing happened: the drop is recorded and
                      replicates to the members that do hold it.
                  confirmation:
                    $ref: "#/components/schemas/DdlConfirmation"
                    description: |
                      Present on a clustered node: what each live member
                      answered when the drop was pushed to it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/vector:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [vectors]
      operationId: getVectorConfig
      summary: The collection's embedding configuration.
      x-kimmy-action: read
      responses:
        "200":
          description: The configuration, or null when embedding is not enabled.
          content:
            application/json:
              schema:
                type: object
                required: [vector]
                properties:
                  vector:
                    oneOf:
                      - $ref: "#/components/schemas/VectorConfig"
                      - type: "null"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [vectors]
      operationId: configureVectors
      summary: Enable or reconfigure embeddings on a collection.
      description: |
        Creates a shadow collection `{coll}.__vectors`, maintained by a worker
        that is an ordinary change-stream subscriber — so existing documents
        are backfilled rather than needing a separate command, and each
        document is embedded exactly once cluster-wide.

        Embedding is off the write path: a write returns as soon as its oplog
        entry is durable, and vectors follow.
      x-kimmy-action: ddl
      requestBody:
        required: true
        description: |
          Closed, like every request shape (ADR-121): a field `VectorConfig`
          or its `provider` and `chunk` objects do not define is refused
          `422`. The schema itself is not marked so because `GET` and
          `describe` return it, and a response schema stays open.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VectorConfig" }
      responses:
        "200":
          description: Configured.
          content:
            application/json:
              schema:
                type: object
                required: [collection, vector, shadow]
                properties:
                  collection:
                    type: string
                  vector: { $ref: "#/components/schemas/VectorConfig" }
                  shadow:
                    type: string
                    description: Name of the collection holding the vectors.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [vectors]
      operationId: disableVectors
      summary: Stop embedding a collection.
      x-kimmy-action: ddl
      parameters:
        - name: drop_vectors
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Discard the stored vectors as well as the configuration.
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                required: [disabled, droppedVectors]
                properties:
                  disabled:
                    type: boolean
                  droppedVectors:
                    type: boolean
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/docs/{id}/vectors:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
      - $ref: "#/components/parameters/DocId"
    get:
      tags: [vectors]
      operationId: getDocumentVectors
      summary: The chunks stored for one document.
      x-kimmy-action: read
      responses:
        "200":
          description: Every chunk, in split order.
          content:
            application/json:
              schema:
                type: object
                required: [count, chunks]
                properties:
                  count:
                    type: integer
                  chunks:
                    type: array
                    items:
                      type: object
                      required: [chunk, vector, text]
                      properties:
                        chunk: { type: integer }
                        vector:
                          type: array
                          items: { type: number }
                        text: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [vectors]
      operationId: putDocumentVectors
      summary: Store vectors a client computed itself.
      description: |
        What makes the `byo` provider — the default — usable.

        **Replace-all, per document.** The body is the complete set of chunks
        for this document; anything previously stored under it and not named
        here is removed. That is the only semantics under which a shortened
        document cannot leave orphan chunks matching text it no longer
        contains.

        The server supplies the source document's HLC itself, so staleness
        detection keeps working and a client never has to know the internal
        record shape.
      x-kimmy-action: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [chunk, vector]
                properties:
                  chunk:
                    type: integer
                    description: Chunk number within the document, in split order.
                  vector:
                    type: array
                    items: { type: number }
                  text:
                    type: string
                    description: |
                      The text this vector was produced from. Used by the
                      keyword half of hybrid search.
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [stored, _id]
                properties:
                  stored:
                    type: integer
                  _id: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [vectors]
      operationId: deleteDocumentVectors
      summary: Discard one document's vectors.
      x-kimmy-action: write
      responses:
        "200":
          description: How many chunks were removed.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/vector_search:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [vectors]
      operationId: vectorSearch
      summary: k-nearest-neighbour search.
      description: |
        Send `query` text to have the server embed it, or `vector` to search by
        a vector you computed. A `byo` collection has no server-side provider,
        so it requires `vector`.

        `filter` post-filters: the graph search widens to compensate, because a
        pre-filter would need the index to know about document state it
        deliberately does not track. Filtering requires `read` alongside
        `search`.
      x-kimmy-action: search (plus read when filtering)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: The matches, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NoVectors" }
        "502":
          description: An embedding provider failed. The upstream's fault, not the caller's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/db/{db}/coll/{coll}/hybrid_search:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    post:
      tags: [vectors]
      operationId: hybridSearch
      summary: Vector and keyword search, fused.
      description: |
        Reciprocal rank fusion over a dense half and a lexical half, each
        retrieved wider than `k` so a document ranked modestly by both can beat
        one ranked first by only one.

        **`query` text is required.** The lexical half cannot be derived from a
        bare vector, so that request is refused rather than silently degrading
        to plain vector search.

        Two optional fields tune the fusion. `weights` scales each half's
        contribution (`dense / (60 + rank_dense) + lexical / (60 + rank_lexical)`);
        `min_overlap` is how many distinct query terms a chunk must contain to
        count as lexical evidence at all — a document it removes from the
        lexical half keeps whatever the dense half gave it. Their defaults,
        equal weights and `1`, are plain reciprocal rank fusion, exactly the
        ranking a request that omits them gets. The lexical half ranks by term
        overlap, so on a corpus of short documents `min_overlap: 2` is the
        practical way to stop near-random lexical ranks outvoting the dense
        ones. See `docs/vectors.md`.
      x-kimmy-action: search (plus read when filtering)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: The fused matches, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: |
            Missing `query`; a negative weight, both weights zero, or
            `min_overlap` below 1; or an otherwise unanswerable request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NoVectors" }
        "502":
          description: An embedding provider failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/db/{db}/coll/{coll}/webhooks:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List the subscriptions on a collection.
      description: Secrets are never included.
      x-kimmy-action: webhook
      responses:
        "200":
          description: The subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, count]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
                  count:
                    type: integer
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [webhooks]
      operationId: registerWebhook
      summary: Register a webhook.
      description: |
        Requires the `webhook` action rather than `watch`: this hands out an
        ongoing egress path to an address the grant never named, which outlives
        the token that created it.

        Delivery starts from *now*, not from the beginning of the retained
        oplog — registering on a busy collection does not produce a flood of
        history at whatever endpoint was just wired up.

        The signing secret is generated here, returned **once**, and never
        again. A caller who loses it re-registers.
      x-kimmy-action: webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  description: |
                    Checked against the egress policy here, and again before
                    every delivery — a name that resolves publicly now can
                    resolve inward later.
                operations:
                  type: array
                  description: Absent means every operation.
                  items:
                    type: string
                    enum: [insert, update, replace, delete]
      responses:
        "200":
          description: Registered. The secret appears here and nowhere else.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, secret]
                properties:
                  id: { type: string }
                  url: { type: string }
                  secret:
                    type: string
                    description: HMAC key for verifying deliveries. Shown once.
                  note: { type: string }
        "400":
          description: A malformed URL, an unknown operation, or a destination the egress policy refuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/WrongShape" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
      - $ref: "#/components/parameters/WebhookId"
    delete:
      tags: [webhooks]
      operationId: removeWebhook
      summary: Remove a subscription.
      description: |
        A subscription registered on another collection cannot be removed by
        guessing its id from a collection the caller does hold a grant on — the
        record is read and checked before it is deleted.
      x-kimmy-action: webhook
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/db/{db}/coll/{coll}/watch:
    parameters:
      - $ref: "#/components/parameters/Db"
      - $ref: "#/components/parameters/Coll"
    get:
      tags: [streaming]
      operationId: watchCollection
      summary: Open a change stream (WebSocket).
      description: |
        A WebSocket upgrade. Once open, the server sends one JSON text frame
        per change; the client sends nothing but may close.

        **A resume token resumes on any node.** On the node that issued it the
        resume is exact. On any other node it delivers every event the stream
        had not sent and may repeat events sent before the token
        (at-least-once): up to one read once the stream had caught up, and
        everything since it opened before then. That is what lets a client
        fail over mid-stream. See ADR-173.

        Authorization happens *before* the upgrade, and so does opening the
        stream — an expired resume token is a `410` rather than an
        unexplained socket close after a successful handshake.

        Every event carries `resumeToken` and `clusterTime`. `fullDocument` is
        included only when asked for, and is dropped from an oversized event
        rather than dropping the event.

        OpenAPI cannot describe a WebSocket session, so the frame schema is in
        `components.schemas.ChangeEvent` and this operation documents the
        handshake alone.
      x-kimmy-action: watch
      parameters:
        - name: resume_after
          in: query
          required: false
          schema: { type: string }
          description: Resume immediately after this token.
        - name: from_start
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Replay from the beginning of the retained oplog — **for this
            collection's current incarnation.** A collection dropped and
            recreated under the same name reuses its id, so its predecessor's
            entries are still in the log; they are not this collection's
            history and are never delivered.
        - name: full_document
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Include the full post-image on every event.
      responses:
        "101":
          description: |
            Upgraded. Frames from here on are `ChangeEvent` objects as JSON
            text.
        "400":
          description: |
            A malformed resume token, or a request that is not a WebSocket
            upgrade — a missing or wrong `Connection`, `Upgrade`,
            `Sec-WebSocket-Version` or `Sec-WebSocket-Key` header.

            The second kind is refused by the framework, and is mapped onto
            this envelope deliberately: left alone it renders as bare text with
            no `error` code, which made this the one refusal on the API that a
            client could not branch on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "426":
          description: |
            The connection cannot be upgraded at all — an HTTP/1.0 request, or
            a proxy that has already consumed the upgrade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: |
            The resume point cannot be continued from, for one of two reasons:
            retention collected it, or it belongs to a **previous incarnation**
            of this collection — one dropped and recreated under the same name.

            Both mean the same thing to a client: there is a gap between where
            it was and where this collection now begins, so it must start again
            and reconcile. Refused here rather than quietly resumed at the
            boundary, because a silent gap is what the invalidate machinery
            exists to prevent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/admin/backup:
    get:
      tags: [admin]
      operationId: backup
      summary: Take a consistent backup of this node.
      description: |
        Requires `admin` over `*` — the same bar as managing users, and for the
        same reason: a backup is *every* document on the node, so anything less
        would let a database-scoped administrator read past their own grants.
        There is no filtered backup, because a partial backup that looks like a
        whole one is a restore that silently loses data.

        The whole store is walked under one read transaction and written to an
        unlinked temporary file in the data directory; the transaction closes
        before the first byte is sent, and the file is streamed. The member needs
        free space there equal to one backup for the duration, and holds one read
        chunk of it in memory. The headers arrive when the walk has finished,
        which on a store of a few gigabytes can take minutes: the request deadline
        does not apply to this route, so give the client a read-idle timeout
        rather than a total one. A data directory without room answers `500`.
      x-kimmy-action: admin over `*`
      responses:
        "200":
          description: The backup, as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="kimmy-{node}-{created}.backup"`'
            Content-Length:
              schema: { type: integer }
              description: The size of the backup in bytes, known before it is sent.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token from `POST /v1/auth/login`.

  parameters:
    Db:
      name: db
      in: path
      required: true
      schema: { type: string }
      description: Database name.
    Coll:
      name: coll
      in: path
      required: true
      schema: { type: string }
      description: Collection name.
    DocId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        The document's `_id` as a path segment. A 24-character hex string is
        read as an ObjectId, a bare integer as an Int64, and anything else as a
        string.
    UserName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Username.
    RoleName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Role name.
    IndexName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Index name.
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Subscription id, as returned by registration.

  responses:
    BadRequest:
      description: |
        The request could not be understood or is not answerable as asked.
        Also a query string the route cannot read — a parameter it does not
        define, or a value that is not the type it takes; the message names
        the parameter (ADR-121). On an operation that declares no query
        parameter, any query string at all: the message names the first
        parameter and says the route takes none (ADR-124). A query string is
        refused `400` where a body of the wrong shape is `422`: it is part of
        the request line, not an entity the server failed to process.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoVectors:
      description: |
        The collection has a vector configuration but no stored vectors, so a
        search cannot match anything. A refusal rather than an empty result:
        empty is indistinguishable from "nothing matched", which is how a `byo`
        collection returns nothing forever while looking like it works.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WrongShape:
      description: |
        The body is valid JSON but not the shape this route takes — an object
        where an array is wanted, a missing required field, a field the
        route does not define, or an explicit `null` on a declared
        *optional* field that does not accept one (ADR-121, ADR-128; the
        message names it). An omitted optional field still means what it
        always meant — `null` is refused because it is not the same
        request, not because the field stopped being optional. A `null` on
        a *required* field is refused too, but downstream, by that field's
        own type, and not always at this status. Carries the `bad_request`
        code: the status distinguishes "not JSON" from "not this JSON", and
        the code says what a client should do about either. A document
        body — insert, replace, bulk — is content and takes any field,
        `null` values included. One exception to "the message names it": a
        wrong-typed or `null` value inside a tagged `provider` object names
        `provider`, not the field inside it (`provider.endpoint`, say) —
        true of every value error there, not only `null` — because that
        value is re-read through a second deserializer once the `kind` tag
        is matched, and the path tracker cannot see across the seam. An
        ordinary nested object, `chunk` among them, is unaffected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No token, an invalid or expired token, or a token whose account has
        since been deleted, disabled, or had its sessions revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Denied by RBAC. Deliberately identical whether or not the target
        exists — a distinct 404 would let a caller probe for collections they
        cannot access.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such database, collection, document or record.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        A duplicate `_id`, or a value that would break a unique index.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        Over a rate limit. Carries `Retry-After`. Login has one by address (and
        optionally by username); every authenticated operation has one by
        principal when `server.rate_limit.per_principal` is set, so a 429 can
        answer any operation that takes a token, not only this one.
      headers:
        Retry-After:
          schema: { type: integer }
          description: |
            Seconds to wait. Always present on a 429 — a refusal that does not
            say when to come back leaves a client to guess, and clients guess
            badly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: |
        The envelope every failure uses, including a body the framework itself
        rejected. The HTTP status carries the class, `error` is what a client
        branches on, and `retry` is what a client library acts on without
        having to know the code.
      required: [error, message, retry]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable. Not stable; do not parse it.
        retry:
          $ref: "#/components/schemas/Retry"

    ErrorCode:
      type: string
      description: |
        The complete set. Closed in the server by an enum, so a new failure
        cannot invent a code without also declaring its retry class — the two
        answers are made at the same moment or the build fails.

        Codes are strings rather than numbers deliberately: a client's branch
        reads as what it means.

        | Code | Status | Retry | Meaning |
        |---|---|---|---|
        | `bad_request` | 400, 422 | no | Malformed filter, update, projection or Extended JSON; a body of the wrong shape; a batch over the cap |
        | `payload_too_large` | 413 | no | Request body over the node's ceiling (`server.max_body_bytes`, 2 MiB by default) |
        | `unsupported_media_type` | 415 | no | A JSON body without a JSON content type |
        | `unauthorized` | 401 | no | Missing, invalid or expired token; bad credentials; an account deleted, disabled or re-credentialed since the token was issued |
        | `forbidden` | 403 | no | Denied by RBAC. Identical whether or not the target exists |
        | `not_found` | 404 | no | No such database, collection, document or user |
        | `conflict` | 409 | no | Collection exists; the last user; deleting your own account |
        | `duplicate_key` | 409 | no | `_id` already present |
        | `unique_violation` | 409 | no | A unique index would be broken |
        | `no_vectors` | 409 | no | Searching a collection whose vectors were never ingested — distinguished from an empty result, which is indistinguishable from "nothing matched" |
        | `resume_token_expired` | 410 | no | The resume point cannot be continued from — collected by retention, or belonging to a previous incarnation of a collection that was dropped and recreated. Resubscribe |
        | `rate_limited` | 429 | wait | Over a limit — failed logins by address or username, or an authenticated principal's request budget when `server.rate_limit.per_principal` is set. Carries `Retry-After` |
        | `not_implemented` | 501 | no | A reserved capability that does not exist |
        | `provider_error` | 502 | wait | An upstream embedding provider failed. Every node calls the same provider, so waiting helps and moving does not |
        | `internal` | 500 | elsewhere | A storage failure on this node. Details are logged, never returned |
        | `misconfigured` | 500 | elsewhere | This node lacks something it needs, such as an API key named by its vector configuration |
        | `snapshot` | 500 | elsewhere | A vector index snapshot on this node could not be used |
        | `stale` | 409 | no | A conditional write's `if_stamp` did not match: the document is at another version, or is gone. Nothing was written. Re-read, decide again, and send a new request with the current stamp |
        | `timeout` | 503 | wait | The request was still waiting — for the rest of its body, or for an embedding provider — at the node's deadline (`server.request_timeout_secs`, 30 s by default) and was abandoned. Not a query timeout: storage work already running completes and is answered. No `Retry-After`; the server does not know when a slow client or provider will be faster |
      enum:
        - bad_request
        - payload_too_large
        - unsupported_media_type
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - duplicate_key
        - unique_violation
        - no_vectors
        - resume_token_expired
        - rate_limited
        - internal
        - misconfigured
        - snapshot
        - not_implemented
        - provider_error
        - stale
        - timeout

    Capability:
      type: string
      description: |
        A named, client-visible feature. Closed in the server by an enum, so a
        capability cannot be advertised that the build does not have, and
        adding a feature without naming it here is a visible omission rather
        than a silent one.

        Most are constant for a given build; `local-embeddings` is the one that
        genuinely varies today, because in-process embedding is a compile-time
        feature and a `local` provider is refused on a build without it. The
        rest matter across *versions*: a client may be talking to a node from
        before the feature existed.

        **A client should treat an unknown capability as one it does not use,
        and a missing capability as a feature to avoid** — not as an error.
        Both are how this list stays additive.

        | Capability | What it means |
        |---|---|
        | `aggregation` | `POST .../aggregate` and the pipeline stages |
        | `backup` | `GET /v1/admin/backup` |
        | `bulk-insert` | `POST .../bulk`, one commit, all or nothing |
        | `change-streams` | The `/watch` WebSocket, with resume tokens portable across nodes |
        | `client-supplied-vectors` | `PUT .../docs/{id}/vectors`, which is what makes the `byo` provider usable |
        | `cursor-paging` | `nextCursor` on `find`, and the `cursor` parameter that continues it |
        | `find-and-modify` | `POST .../find_and_modify` |
        | `conditional-writes` | `if_stamp` on every single-document write, `stamps` on `find`, `ETag` on a read by id, and the `stale` error code (ADR-084) |
        | `hybrid-search` | `POST .../hybrid_search` |
        | `local-embeddings` | This build can embed in-process; a `local` provider will be accepted |
        | `partial-indexes` | `partialFilterExpression` on index creation |
        | `token-refresh` | `POST /v1/auth/refresh`, so an active client never re-sends credentials |
        | `topology` | `GET /v1/topology`, the nodes a client may fail over to |
        | `ttl-indexes` | `expireAfterSeconds` on index creation |
        | `vector-search` | `POST .../vector_search` |
        | `webhooks` | Registering an endpoint to push change events to |
      enum:
        - aggregation
        - backup
        - bulk-insert
        - change-streams
        - client-supplied-vectors
        - conditional-writes
        - cursor-paging
        - find-and-modify
        - hybrid-search
        - local-embeddings
        - partial-indexes
        - token-refresh
        - topology
        - ttl-indexes
        - vector-search
        - webhooks

    Retry:
      type: string
      description: |
        What a client may do about a failure. **Three-valued rather than a
        boolean, because KimmyDB is leaderless** — every node accepts writes,
        so "ask a different node" is an answer available here that a
        primary-based database cannot give, and it is the right answer for a
        node-local failure. Telling a client only "retryable" would have it
        retry the one machine that just failed (ADR-057).

        It travels in the envelope rather than living only in this document, so
        a client meeting a code added after its release still knows what to do
        with it. That is what makes adding a code an additive change.
      # Quoted, and it matters: in YAML 1.1 a bare `no` is the boolean false.
      # Rust's reader parsed it as the string and PyYAML as `False`, so two
      # readers of this document disagreed about a value on the wire — found by
      # driving a real node with a second, independently written validator.
      enum: ["no", "wait", "elsewhere"]
      x-kimmy-meanings:
        "no": Nothing to retry. The request must change, or the condition must.
        wait: The same node, after a delay — `Retry-After` when the server knows it, otherwise the client's own backoff.
        elsewhere: A different node. The failure is local to this one and a peer holds the same data.

    Document:
      type: object
      description: |
        An arbitrary document, encoded as Extended JSON v2. There is no schema:
        the store is schemaless by design, and a schema inferred from a sample
        would make perfectly valid documents unrepresentable (ADR-055).
      additionalProperties: true

    ArrayFilters:
      type: array
      description: |
        Which array elements the update's `$[<identifier>]` path segments
        address (ADR-104). One filter document per identifier: every
        top-level field of the document starts with the identifier, and the
        filter is evaluated against each element with that prefix removed —
        `{"line.qty": {"$gt": 5}}` tests `{"qty": {"$gt": 5}}` against each
        element, a bare `{"line": {"$gt": 5}}` tests the element itself.
        Every identifier a path uses needs exactly one filter and every
        filter must be used by some path; either mismatch is a `400`. `$[]`
        addresses every element and needs no filter. Identifiers start with a
        lowercase letter and contain only letters and digits. `$and`, `$or`
        and `$nor` may group conditions on the same identifier.
      items: { $ref: "#/components/schemas/Document" }
      example:
        - { "line.sku": "gasket" }

    GrantInput:
      type: object
      description: |
        A grant as a request carries it: the same three fields as `Grant`,
        closed (ADR-121). `collection` defaults to `*`, so a misspelt field
        here would not be dropped but would widen the grant to every
        collection in the database; it is refused `422` by name instead.
        `Grant` itself is the persisted and returned form and stays open, as
        every response schema does.
      additionalProperties: false
      required: [db, actions]
      properties:
        db:
          type: string
        collection:
          type: string
          default: "*"
        actions:
          type: array
          items:
            type: string
            enum: [read, write, watch, search, webhook, ddl, admin]

    Grant:
      type: object
      description: |
        One grant: a set of actions over a database and a collection pattern.
        `*` matches anything; a collection pattern may end in a single `*`.
        Returned wherever grants are listed; a request sends `GrantInput`.
      required: [db, actions]
      properties:
        db:
          type: string
        collection:
          type: string
          default: "*"
        actions:
          type: array
          items:
            type: string
            enum: [read, write, watch, search, webhook, ddl, admin]
            description: |
              `admin` implies everything and `write` implies `read`, so those
              do not need listing separately. `watch`, `search`, `webhook` and
              `ddl` are independent: a webhook hands out an ongoing egress
              path, which is a different act from being allowed to read, and
              `ddl` shapes a collection — create, drop, index, configure
              embeddings — without granting access to what is in it. `ddl`
              federates; `admin` does not (ADR-090).

    Node:
      type: object
      description: |
        One node of the cluster, as this node understands it.
      required: [node, endpoint, version, status, self]
      properties:
        node:
          type: string
          description: The node id, stable across restarts and address changes.
        endpoint:
          oneOf:
            - type: string
            - type: "null"
          description: |
            The URL clients should use, as the node itself advertises it. Null
            when the node has not been told what to advertise; the answering
            node may be null this way and still be usable, since a client that
            reached it already knows its address.
        version:
          oneOf:
            - type: string
            - type: "null"
          description: |
            The build the node was running when it last registered, which is at
            its last start. Useful mid-rolling-upgrade.
        status:
          type: string
          enum: [live, unknown]
          description: |
            `live` if the answering node currently sees it in the cluster, or if
            it *is* the answering node. `unknown` otherwise — registered, but
            not currently vouched for.

            **`unknown` is not `down`, and it may be permanent.** It means the
            answering node has not heard from that peer, which is not the same
            as the peer being unreachable from the client. A node that was
            decommissioned stays listed as `unknown` indefinitely — records are
            written at startup and never aged out — until an operator deletes
            its registry document (see deviations.md, "A decommissioned node
            stays in the topology"). A client choosing a failover target should
            prefer `live` nodes and treat a persistently `unknown` one as
            possibly gone, not merely momentarily quiet.
        self:
          type: boolean
          description: Whether this is the node that answered.
        staleSince:
          type: integer
          description: |
            Present only while the answering node's replication loop finds
            this peer trailing it by more than `storage.tombstone_retention_secs`
            — milliseconds since the epoch at which that was first noticed.
            Such a peer may hold documents this node has deleted and already
            collected the tombstones for; merging it can resurrect them. The
            recommended action is to reset that peer's data directory and let
            anti-entropy refill it (ADR-085).
        behindSecs:
          type: integer
          description: |
            With `staleSince`: how far the peer trailed at the last round, in
            seconds.

    Token:
      type: object
      description: |
        A bearer token and how long it lasts. `expiresIn` is reported rather
        than left to be discovered by decoding the token: the token is opaque
        to this protocol, and a client that parses one to schedule its refresh
        is depending on a shape nothing promised it.
      required: [token, user, expiresIn]
      properties:
        token:
          type: string
          description: "Send as `Authorization: Bearer <token>`."
        user:
          type: string
        expiresIn:
          type: integer
          description: |
            Seconds from now until this token stops working. Refresh before
            then; after it, log in again.

    User:
      type: object
      required: [user, grants]
      properties:
        user: { type: string }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        disabled: { type: boolean }

    Updated:
      type: object
      required: [updated]
      properties:
        updated:
          type: string
          description: The name of what changed.

    FindRequest:
      type: object
      additionalProperties: false
      description: |
        Every read parameter. `filter`, `sort` and `projection` follow the
        query language in `docs/query-language.md`.
      properties:
        filter: { $ref: "#/components/schemas/Document" }
        sort: { $ref: "#/components/schemas/Document" }
        projection: { $ref: "#/components/schemas/Document" }
        limit:
          type: integer
          minimum: 0
          default: 100
          description: |
            Documents in one page. **Omitting it means 100, not "all"** — a
            client that treats an unlimited `find` as the whole collection
            silently processes a prefix.

            A larger value is **clamped to 10,000 rather than refused**, so
            asking for more than the cap succeeds and returns less than was
            asked for. Walk with `cursor` instead.

            `0` is a window of nothing, not a request for the default: an
            empty `documents`, `count` of `0`, and no `nextCursor`, on every
            access path and every sort order.
        skip:
          type: integer
          minimum: 0
          description: |
            Costs work proportional to what it skips. Use `cursor` for paging;
            `skip` is for jumping.

            A page reached by a non-zero `skip` carries **no `nextCursor`**,
            however full it is — the two ways of saying where to resume are
            not mixed, and combining them in one request is refused outright.

            With a `sort` other than `{"_id": 1}`, `skip + limit` may not
            exceed 10,000 — that is what the server holds while it sorts — and
            a larger window is refused with `400` rather than clamped, because
            a clamped skip would return a different page and say nothing. To
            page deeper, sort by `_id` and follow `nextCursor`, or narrow the
            filter on the sort field to where the last page ended.
        explain:
          type: boolean
          default: false
          description: Report how the query was answered alongside the results.
        cursor:
          type: string
          description: |
            A `nextCursor` from a previous page. Opaque, node-portable, and
            carrying no server state.

            Refused with `400` when combined with `skip`, or with any `sort`
            other than `{"_id": 1}` — both would mean the page is not the one
            the cursor describes, and silently honouring one of the two is how a
            client ends up reading a different set than it asked for. A token
            that is not one is also a `400`.
        stamps:
          type: boolean
          default: false
          description: |
            Return each document's stamp in a parallel `stamps` array, for a
            conditional write that follows. Off by default: a version is not
            one of the document's fields, and most reads do not want one.

    FindResponse:
      type: object
      required: [documents, count]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        count:
          type: integer
          description: Documents in *this page*, not in the collection.
        stamps:
          type: array
          items: { $ref: "#/components/schemas/Stamp" }
          description: |
            Present when the request set `stamps: true`. Parallel to
            `documents`: `stamps[i]` is the version of `documents[i]`.
        nextCursor:
          type: string
          description: |
            Present when the page filled, `skip` was `0`, and the query is one
            a cursor can continue. Absent means the end of the results, a
            query whose order a cursor cannot express, or a page reached by a
            non-zero `skip` — never a token that would page in a different
            order than the one asked for, or from a position the caller did
            not choose.

            **A full page is not proof there is more.** A collection of exactly
            100 documents read 100 at a time offers a token whose next page is
            empty; the walk ends when a page comes back short or without a
            token, not when a token stops being offered.
        explain: { $ref: "#/components/schemas/Explain" }

    Stamp:
      type: string
      description: |
        A document's version: the stamp of the write that produced it, as an
        opaque token. Returned by every write, by `find` with `stamps: true`,
        and as the `ETag` of a read by id; passed back as `if_stamp` to make a
        write conditional on the document still being at that version
        (ADR-084). Compare for equality only — nothing about its shape is
        promised.

    Explain:
      type: object
      description: |
        How a query was, or an update or a delete would be, answered. Present
        only when `explain` was requested. On `find` and `count` this
        describes the read that happened; on `update` and `delete` it
        describes the read-only plan that ran *instead of* the write
        (ADR-131) — the shape is identical either way.
      required: [strategy, index, indexFieldsUsed, documentsExamined, documentsMatched]
      properties:
        strategy:
          type: string
          enum: [collectionScan, index, indexUnion, idLookup]
          description: |
            `indexUnion` is a union of equality probes — the shape `$in`
            planning produces — and is named rather than folded into `index`
            because it is a different amount of work.

            `idLookup` means the filter pinned `_id` and the documents were
            read through the primary key, consulting no index. It is reported
            for an `_id` equality and for an `$in` over `_id`, and `index` is
            null for it because none was used and none needs to exist. A
            filter naming `_id` inside an `$or`, or with a range rather than an
            equality, is not an `idLookup`.

            A new strategy name is an additive change under the compatibility
            policy: treat an unrecognized value as "some access path this
            client does not know about" rather than as an error.
        index:
          oneOf:
            - type: string
            - type: "null"
          description: |
            The index used. Null for a collection scan, and null for
            `idLookup`, where the primary key answered and no index was
            consulted.
        indexFieldsUsed: { type: integer }
        documentsExamined: { type: integer }
        documentsMatched:
          type: integer
          description: |
            Documents the filter matched. On `update` and `delete` under
            `explain: true`, this is the write's selection — the route's own
            `matched`/`modified`/`deleted` stay zero, since nothing was
            written (ADR-131). On `delete` that selection is exactly what a
            real delete would remove; on `update` it is not a guarantee,
            since `explain` never runs the update operators — a document
            counted here can still be one the real write refuses, if an
            operator cannot apply to it.
        probes:
          type: integer
          description: Index ranges scanned. Present only when more than one.
        indexEntriesRead:
          type: integer
          description: |
            Index entries read, when an index answered a read. How much of the
            index the query touched, as distinct from how many documents it
            examined: an equality on a complete key stopped by `limit` reads
            as many entries as it returns, while a range that had to be put
            in `_id` order reads the whole range however few documents it
            returns. Absent for a collection scan and an `idLookup`.
        unkeyedCandidates:
          type: integer
          description: |
            Of `indexEntriesRead`, the entries read from the index's unkeyed
            run: documents the index holds but could not key — arrays at two
            of a compound index's paths, more than 1,000 keys, a Decimal128 —
            which every scan of that index reads and rechecks whatever the
            filter asked for. Present whenever `indexEntriesRead` is, and 0
            for an index that keys every document it holds. A number above 0
            is the cost of leaving such documents under the index; the index
            listing's `unkeyed` reports the same set by size.

    ViolationGroup:
      type: object
      description: |
        Documents that still share a key under a unique index, re-evaluated
        when asked: a member deleted or rewritten out of the collision is no
        longer listed. `merged` is the one whose arrival revealed the
        collision — the actionable one, since the others were already visible
        to clients. It is the recorded arrival, so once its own value has been
        rewritten it can name a document that is no longer among `ids`.
      required: [ids, merged, documents]
      properties:
        ids:
          type: array
          items: {}
        merged: {}
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }

    Index:
      type: object
      required: [name, fields, unique, enforcement, multikey, unkeyed]
      properties:
        name: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [path, descending]
            properties:
              path: { type: string }
              descending: { type: boolean }
        unique: { type: boolean }
        enforcement:
          type: string
          enum: [local, coordinated]
        multikey:
          type: boolean
          description: |
            Set once any indexed document held an array at an indexed path, and
            never cleared. Surfaced so an operator can see *why* a two-sided
            range on this index does not stop at its upper bound.
        unkeyed:
          type: integer
          description: |
            Documents the index holds that it could not key: arrays at two of
            a compound index's paths, more than 1,000 keys for one document,
            or a Decimal128 at an indexed path. They are stored and every
            query still finds them, but each scan of this index rechecks all
            of them, and a unique index does not check them at all. Zero is
            the index doing its whole job. Anything else names work for the
            collection's owner — reshape those documents, or split the index
            — visible here without access to the server's logs, where each
            one was also warned about by id.
        expireAfterSeconds:
          type: integer
          description: Present only on a TTL index.
        partialFilterExpression:
          $ref: "#/components/schemas/Document"
          description: Present only on a partial index.
        confirmation:
          $ref: "#/components/schemas/DdlConfirmation"
          description: |
            Present on the `createIndex` response of a clustered node only:
            what each live member answered when the definition was pushed to
            it. Never on a listing or a description.

    DdlConfirmation:
      type: object
      description: |
        What confirming a schema change on the cluster's live members found
        (ADR-140). Node ids are the ones `/v1/topology` reports. The member
        that answered the request is not listed: it holds the change by
        construction.
      required: [confirmed, refused, pending]
      properties:
        confirmed:
          type: array
          items: { type: string }
          description: Members that applied the change, or already held it.
        refused:
          type: array
          items: { type: string }
          description: |
            Members that could not apply the change and skipped it — a
            definition they cannot apply, or a rival under the same name they
            cannot arbitrate — counted in their `kimmy_sync_ddl_refused_total`
            and logged there with the reason; or that do not hold the
            collection it names.
        pending:
          type: array
          description: |
            Members that did not answer before `cluster.ddl_confirm_timeout_secs`,
            or that were too far behind for one push to reach — more than a
            batch behind this node, or below its retention horizon — each with
            why. Each receives the change through anti-entropy; the response
            cannot say when.
          items:
            type: object
            required: [node, reason]
            properties:
              node: { type: string }
              reason: { type: string }

    CollectionDescription:
      type: object
      required:
        [database, collection, documentCount, sampled, fields, indexes, vector, nodeDurability]
      properties:
        database: { type: string }
        collection: { type: string }
        documentCount: { type: integer }
        nodeDurability:
          type: string
          enum: [durable, coalesced]
          description: |
            The durability class of the **node that answered** — the same
            value `GET /v1/version` reports as `durability` (ADR-088). A fact
            about the node's configuration, not about this collection; it is
            here so that the one call made before writing already says what
            an acknowledged write means. Both classes are durable when the
            response returns.
        sampled:
          type: integer
          description: Documents actually examined to produce this.
        fields:
          type: array
          items:
            type: object
            required: [path, types, presence]
            properties:
              path:
                type: string
                description: Dotted for nested fields.
              types:
                type: array
                items: { type: string }
              presence:
                type: number
                description: |
                  Fraction of the *sampled* documents holding this field,
                  rounded to three decimals — the raw ratio carries false
                  precision.
              example: {}
        indexes:
          type: array
          items: { $ref: "#/components/schemas/Index" }
        vector:
          oneOf:
            - $ref: "#/components/schemas/VectorConfig"
            - type: "null"

    VectorConfig:
      type: object
      required: [fields, provider, dim]
      properties:
        fields:
          type: array
          minItems: 1
          items: { type: string }
          description: Document fields whose text is embedded, in order. Dot paths allowed.
        provider: { $ref: "#/components/schemas/ProviderConfig" }
        dim:
          type: integer
          minimum: 1
          maximum: 16384
          description: |
            Vector width, pinned at configuration time. Changing a model
            changes this, and mixing widths in one index is meaningless, so a
            change requires an explicit reindex.
        metric:
          type: string
          enum: [cosine, euclidean, dot]
          default: cosine
        chunk:
          type: object
          properties:
            max_chars:
              type: integer
              default: 2000
              description: |
                Characters rather than tokens: a token count depends on the
                model's tokenizer, which storage has no business knowing about.
            overlap:
              type: integer
              default: 200
            max_tokens:
              type: integer
              minimum: 1
              description: |
                Also cut a chunk once its *estimated* token count reaches this
                — one token per two bytes of UTF-8, conservative for prose,
                code and CJK alike. Set it to the provider's per-input limit
                so dense text cannot produce a chunk the provider refuses.
                Absent means the character rule alone.

    ProviderConfig:
      type: object
      description: |
        Tagged by `kind`. `byo` is the default and the only one needing nothing
        external — no API key, no network, no model download. API keys are
        named by environment variable and never stored in collection metadata.

        The properties below are the union across every `kind`, not a list any
        one of them takes; which kind takes which is the provider table in
        `docs/vectors.md`. A `kind` takes only its own, and a request body
        carrying any other is refused `422` naming it (ADR-121).
        `byo` takes **none** — `{"kind":"byo"}` and nothing else — so
        `{"kind":"byo","model":"..."}` is refused rather than configured as a
        collection that embeds nothing (ADR-134). The schema is not marked
        `additionalProperties: false` because `GET .../vector` and `describe`
        return it and a response schema stays open; the refusal is the
        server's, and this is where it is written down.

        The node's provider policy decides what is accepted (ADR-115): an
        `api_key_env` outside `vector.provider.allowed_key_env` — and any
        `KIMMY_*` name other than `KIMMY_PROVIDER_*`, whatever that setting
        says — is refused `400` by name, as is an `endpoint` (or a dialect's
        default endpoint) that resolves to a loopback, link-local or private
        address the operator has not listed in `vector.provider.allowed_hosts`.
        With `vector.provider.endpoints_locked` set, only `profile`, `byo` and
        `local` are accepted.
      required: [kind]
      properties:
        kind:
          type: string
          description: |
            The wire tag, which is **`open_ai`** for the OpenAI-compatible
            provider — not `openai`. The display name in logs and metrics is
            `openai`, and the two have been confused before; this is the one
            that goes in a request body. Any OpenAI-compatible `/v1/embeddings`
            endpoint uses it, Voyage included.

            `profile` names a provider the operator defined server-side under
            `[vector.providers.<name>]`; the collection carries the name and
            nothing else.
          enum: [byo, open_ai, ollama, custom_http, cohere, gemini, local, profile]
        model: { type: string }
        endpoint: { type: string }
        api_key_env: { type: string }
        dimensions:
          type: integer
          minimum: 1
          description: |
            `open_ai` only. Asked of the provider as the request field of that
            name, for Matryoshka-trained models; must equal `dim`.
        name:
          type: string
          description: |
            `profile` only: the `[vector.providers.<name>]` this collection
            embeds through. Refused `400` when this node defines no such
            profile.

    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: Query text, embedded server-side. Needs a server-side provider.
        vector:
          type: array
          items: { type: number }
          description: A pre-computed query vector. Required when the provider is `byo`.
        filter:
          $ref: "#/components/schemas/Document"
          description: Restrict results to documents matching this filter.
        k:
          type: integer
          default: 10
          description: |
            Hits to return. Defaults to 10 and is **clamped to `[1, 1000]`
            rather than refused**: `0` is read as `1`, and a larger value
            succeeds and answers with 1000 hits at most. There is no
            "window of nothing" here, unlike `find`'s `limit: 0`.
        per_document:
          type: integer
          description: Chunks per document allowed into the results.
        weights:
          type: object
          additionalProperties: false
          description: |
            `hybrid_search` only; `vector_search` ignores it. How much each
            half's rank counts in fusion: the score is
            `dense / (60 + rank_dense) + lexical / (60 + rank_lexical)`. Each
            weight is `>= 0` and they must not both be zero (`400`). Only the
            ratio matters; a weight of `0` switches that half off. A weight
            left out is `1`. The default, equal weights, is plain reciprocal
            rank fusion.
          properties:
            dense: { type: number, minimum: 0, default: 1 }
            lexical: { type: number, minimum: 0, default: 1 }
        min_overlap:
          type: integer
          minimum: 1
          default: 1
          description: |
            `hybrid_search` only; `vector_search` ignores it. How many
            distinct query terms a chunk must contain to enter the lexical
            ranking. A query with fewer distinct terms than this is held to its
            own count, so a one-word query is never gated to nothing. A
            document the gate removes from the lexical half keeps its dense
            contribution. `0` is a `400`.

    SearchResponse:
      type: object
      required: [count, matches]
      properties:
        count: { type: integer }
        matches:
          type: array
          items:
            type: object
            required: [_id, score, chunk, text]
            properties:
              _id: {}
              score: { type: number }
              chunk: { type: integer }
              text: { type: string }

    Webhook:
      type: object
      description: A registered subscription. The signing secret is never included.
      required: [id, database, collection, url, operations, createdBy, createdMs]
      properties:
        id: { type: string }
        database: { type: string }
        collection: { type: string }
        url: { type: string }
        operations:
          type: array
          description: Empty means every operation.
          items:
            type: string
            enum: [insert, update, replace, delete]
        createdBy:
          type: string
          description: |
            Who registered it. A subscription outlives the token that created
            it, so the record of who asked for it matters.
        createdMs: { type: integer }

    ChangeEvent:
      description: |
        One frame on a change-stream WebSocket. Not reachable through any HTTP
        response — it is here because OpenAPI has nowhere else to put a
        WebSocket frame, and a client needs the shape.

        DDL is not delivered: clients see data, not schema changes.
      oneOf:
        - type: object
          title: change
          required: [operationType, resumeToken, clusterTime]
          properties:
            operationType:
              type: string
              enum: [insert, update, replace, delete]
            resumeToken:
              type: string
              description: Portable across nodes. Send it as `resume_after` to continue.
            clusterTime:
              type: string
              description: The originating node's HLC.
            documentKey:
              type: object
              properties:
                _id: {}
            fullDocument:
              $ref: "#/components/schemas/Document"
              description: |
                Only when `full_document` was requested. Dropped from an
                oversized event — the event still goes.
        - type: object
          title: uniqueViolation
          description: |
            A constraint that a merge of replicated writes broke. Not a
            document change, so it carries no `documentKey`; both documents
            remain, and every node that merges reports it.
          required: [operationType, resumeToken, clusterTime, index, merged, documentKeys]
          properties:
            operationType:
              const: uniqueViolation
            resumeToken: { type: string }
            clusterTime: { type: string }
            index: { type: string }
            merged: {}
            documentKeys:
              type: array
              items:
                type: object
                properties:
                  _id: {}
        - type: object
          title: invalidate
          description: |
            The stream is over. The server closes the socket after this frame.

            **A client must act on this rather than reconnect blindly.**
            `CollectionDropped` means there is nothing left to watch;
            `ConsumerLagged` and `ResumeTokenExpired` mean events existed and
            cannot be read, so whatever the client missed is a gap it has to
            reconcile some other way.

            Resuming from a token taken *before* the invalidate is allowed and
            replays up to it — the token is a position in a log that still
            exists, so it invalidates again at the same place. An invalidate
            ends a stream; it is not a permanent wall.
          required: [operationType, reason]
          properties:
            operationType:
              const: invalidate
            reason:
              type: string
              description: |
                | Value | Meaning |
                |---|---|
                | `CollectionDropped` | The collection being watched was dropped. Only streams scoped to it end; a node that learns of the drop by replication ends its streams too |
                | `ConsumerLagged` | Retention collected the range this stream was about to read |
                | `ResumeTokenExpired` | The resume point has been collected from the oplog |

                Treat an unrecognized value as "this stream is over", which is
                what every value means. New ones are additive.
