[package]
name = "kimmy-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Leaderless gossip membership and oplog anti-entropy for KimmyDB"

[dependencies]
kimmy-core.workspace = true
kimmy-storage.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "net", "time", "macros", "io-util"] }
bson.workspace = true
# RustCrypto, so peer authentication adds no *additional* native dependency.
# The build already carries `ring` via `reqwest` (ADR-016), so the rule is not
# to add a second crypto stack rather than to have none.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
parking_lot.workspace = true
postcard = { version = "1", features = ["alloc"] }
# SWIM membership. MPL-2.0 — permitted for an unmodified dependency, and
# recorded in docs/decisions.md rather than left for someone to discover in a
# licence audit.
foca = { version = "2", default-features = false, features = ["std", "postcard-codec", "tracing"] }
# foca requires rand 0.10; the workspace default is 0.9, which kimmy-auth uses.
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
