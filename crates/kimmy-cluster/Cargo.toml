[package]
name = "kimmy-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Leaderless gossip membership and oplog anti-entropy for KimmyDB"

[dependencies]
kimmy-core.workspace = true
kimmy-storage.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "net", "time", "macros", "io-util"] }
bson.workspace = true
# RustCrypto, so peer authentication adds no C toolchain — the same reason
# `jsonwebtoken` uses rust_crypto and storage uses redb.
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
