[package]
name = "kimmy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Terminal client for KimmyDB"

[[bin]]
name = "kimmy"
path = "src/main.rs"

[dependencies]
# The CLI is a consumer of the client crate, not a second implementation of
# it. Nothing here builds a URL or reads a status code — if that ever becomes
# awkward, the awkwardness belongs in `kimmy-client` where every other client
# benefits from fixing it.
kimmy-client.workspace = true
# For the build identity in `kimmy --version` only — the constants baked at
# the root of the graph, so this binary and the server cannot disagree about
# what was built. Requests still go exclusively through `kimmy-client`.
kimmy-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
# For the device flow behind `kimmy login` only. Talking to an
# identity provider is not a KimmyDB request — it is a different service with a
# different protocol — so it does not belong behind `kimmy-client`, and putting
# it there would give every application that links the client crate an OAuth2
# implementation it did not ask for. Every request to a *node* still goes
# through `kimmy-client`, and a test would notice if that stopped being true.
reqwest.workspace = true

# Homebrew installs the binary's name, not the crate's. Commented out with the
# rest of the Homebrew half (ADR-156): dist emits `kimmy.rb` for any package
# that names a formula, whatever `installers` says, and a formula on the
# Release page pinning Linux musl archives is the state that record is about.
# Uncomment it when `aarch64-apple-darwin` comes back to dist-workspace.toml.
[package.metadata.dist]
# formula = "kimmy"
