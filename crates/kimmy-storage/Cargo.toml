[package]
name = "kimmy-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "redb-backed storage engine, indexes, and oplog for KimmyDB"

[features]
# A control for the benchmarks behind ADR-174's addendum, and nothing else.
#
# Compiles the live-count and mark work out of the write path entirely, so a
# benchmark can price that work against the same binary, the same store and the
# same apply path with only those calls removed. A build with this enabled does
# NOT keep the counts and must never ship: the divergence check would read a
# stale number, and the mark would stop telling the next start that a build
# which does not keep the counts has written.
bench-no-live-counts = []

# The count rule's failure injection (ADR-177), for another crate's tests: the
# transport's push tests enable it as a dev-dependency. Never enabled by a
# build that ships.
test-hooks = []

[dependencies]
kimmy-core.workspace = true
redb.workspace = true
bson.workspace = true
serde.workspace = true
toml.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
criterion.workspace = true
# Dev-only: lets the index tests check that an index-backed result is
# identical to a full scan. No production dependency in this direction.
kimmy-query.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# Dev-only: a test reads what `Engine::open` logs, since a line an operator
# is told to act on is behaviour, not decoration.
tracing-subscriber.workspace = true

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "query_path"
harness = false

[[bench]]
name = "concurrent_writes"
harness = false
