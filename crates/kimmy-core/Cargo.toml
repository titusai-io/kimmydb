[package]
name = "kimmy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types for KimmyDB: HLC, identifiers, document records, oplog entries. No I/O."

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
bson.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
# In-process ONNX embedding. Off by default: it pulls ONNX Runtime as native
# binaries plus OpenSSL — hundreds of megabytes and a separate runtime. The
# build is not toolchain-free anyway (ADR-016), but this is a different order
# of cost from a crate that builds some C with `cc`.
local-embeddings = []
