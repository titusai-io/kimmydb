[package]
name = "kimmy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types for KimmyDB: HLC, identifiers, document records, oplog entries. No I/O."

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
bson.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
regex-automata = "0.4"

[dev-dependencies]
proptest.workspace = true
num-bigint.workspace = true
dec.workspace = true
sha2 = "0.11"

[features]
# In-process ONNX embedding. Off by default: it pulls ONNX Runtime as native
# binaries — hundreds of megabytes and a separate runtime; kimmy-vector's
# rustls features on `fastembed` keep it off OpenSSL. The build is not
# toolchain-free anyway (ADR-016), but this is a different order of cost
# from a crate that builds some C with `cc`.
local-embeddings = []

# Reproduces the Q7 merge model's mutants (horizon-first, supersession, reported cells,
# `$setOnInsert` suppression, the v3 generation rule, the B1 and M1 rules, write
# normalisation) through `set_*` methods on `JoinOptions`, and the mutation memory the
# V3M3 and V4M1 mutants read. Off by default; the production code path is the same code
# with the switches at their correct values. It also builds the test harness below.
merge-mutants = []

# The Q7 P0 property-test harness (a port of the reviewed Python model): the
# oracle, the cluster pull protocol, the random runs, the probes and the
# mutants. It needs the mutation switches of `JoinOptions`.
[[test]]
name = "merge_state_sim"
path = "tests/merge_state_sim/main.rs"
required-features = ["merge-mutants"]
