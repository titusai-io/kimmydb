[package]
name = "kimmy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types for KimmyDB: HLC, identifiers, document records, oplog entries. No I/O."

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
bson.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
# The idempotency scope hash and the derived `_id` (B5): SHA-256 is fixed by the
# protocol. Already in the graph through `kimmy-api` and `kimmy-cluster`.
sha2 = "0.11"

[dev-dependencies]
proptest.workspace = true
num-bigint.workspace = true
num-rational.workspace = true

[features]
# In-process ONNX embedding. Off by default: it pulls ONNX Runtime as native
# binaries — hundreds of megabytes and a separate runtime; kimmy-vector's
# rustls features on `fastembed` keep it off OpenSSL. The build is not
# toolchain-free anyway (ADR-016), but this is a different order of cost
# from a crate that builds some C with `cc`.
local-embeddings = []
