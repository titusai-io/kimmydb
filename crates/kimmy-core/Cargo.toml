[package]
name = "kimmy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core types for KimmyDB: HLC, identifiers, document records, oplog entries. No I/O."

[dependencies]
serde.workspace = true
serde_json.workspace = true
bson.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true

[dev-dependencies]
proptest.workspace = true

[features]
# In-process ONNX embedding. Off by default: it pulls native ONNX Runtime
# binaries, which would undo the pure-Rust property that motivated choosing
# redb over RocksDB (ADR-001) and rust_crypto over aws_lc_rs (ADR-016).
local-embeddings = []
