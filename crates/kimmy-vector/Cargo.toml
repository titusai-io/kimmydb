[package]
name = "kimmy-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Embedding providers and vector indexing for KimmyDB"

[dependencies]
kimmy-core.workspace = true
kimmy-storage.workspace = true
kimmy-egress.workspace = true
kimmy-task.workspace = true
bson.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# Optional: only compiled with the `local-embeddings` feature.
#
# default-features = false is load-bearing. The defaults pull native-tls
# (OpenSSL) on top of ONNX Runtime, so a build needs libssl-dev as well; the
# rustls variants avoid that. `image-models` is dropped because this is a text
# embedding pipeline.
fastembed = { version = "7.1", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
hnsw_rs = "0.3.4"

[features]
# In-process ONNX embedding. Off by default: it pulls ONNX Runtime as native
# binaries — hundreds of megabytes and a separate runtime, a different order
# of cost from the `ring` the build already carries (ADR-016). The rustls
# features on `fastembed` above keep it off OpenSSL/native-tls, unlike its
# defaults.
local-embeddings = ["dep:fastembed", "kimmy-core/local-embeddings"]
# WorkerCounters::for_test, which seeds a chosen last_progress and non-zero
# counts for another crate's tests. Off by default; kimmy-api's
# dev-dependency enables it, same shape as kimmy-storage's `test-hooks`.
test-hooks = []

[dev-dependencies]
criterion.workspace = true
# A document record that does not decode, so a store can be failed mid-batch
# (ADR-187). Test-only; the feature never reaches a build that ships.
kimmy-storage = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# The constants the yield evaluator's bounds are tied to (ADR-213): a test asserts
# each one equals its twin there. Dev only: nothing in a build depends on it.
kimmy-cluster.workspace = true

[[bench]]
name = "vector_index"
harness = false
