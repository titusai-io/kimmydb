[package]
name = "kimmy-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP and WebSocket API surface for KimmyDB"

[dependencies]
kimmy-core.workspace = true
kimmy-storage.workspace = true
kimmy-query.workspace = true
kimmy-auth.workspace = true
kimmy-vector.workspace = true
kimmy-cluster.workspace = true
kimmy-egress.workspace = true
axum.workspace = true
base64.workspace = true
tower.workspace = true
tower-http.workspace = true
# For the body wrapper in `limits.rs` that hands a refused body back to be
# drained: the trait comes through axum, the frame type does not.
http-body.workspace = true
http-body-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
bson.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
uuid.workspace = true
reqwest.workspace = true
hmac = "0.13"
sha2 = "0.11"
# The OTel **API** only, never the SDK. This crate extracts an inbound
# `traceparent` and injects an outbound one; which exporter (if any) is behind
# the global propagator is `kimmyd`'s decision, and a library that could make
# it would be a library that starts a network client on someone else's behalf.
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
# The attribute vocabulary, as constants rather than as strings spelled out
# here. `tracing` takes a constant field name in braces — `{ DB_NAMESPACE } =
# value` — so a specification rename is a compile error instead of an attribute
# nothing queries. Constants only: this crate still gets no SDK and no exporter.
opentelemetry-semantic-conventions.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "net", "macros"] }

[dev-dependencies]
parking_lot.workspace = true
# For the tests that assert on what a subscriber sees: the audit record's
# *fields* are the contract a collector reads, and a failed request's *level*
# is what an operator's alert rule is written against (ADR-136). Neither can
# be checked except by capturing what a subscriber formats. Nothing here ships.
tracing-subscriber.workspace = true
# Dev-only, and the layering is deliberate: this crate ships with the OTel API
# alone, but the *tests* need an SDK to install a propagator and an in-memory
# exporter — a span that is exported nowhere cannot be asserted on, and the
# claims here (a `traceparent` becomes a parent, names are gated, the audit
# target never leaves) are exactly the ones that are worthless untested.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# For the stub identity provider the federation tests sign tokens with. A test
# that needs a real IdP reachable fails for reasons unrelated to what it checks.
jsonwebtoken.workspace = true
base64.workspace = true
kimmy-core.workspace = true
uuid.workspace = true
reqwest.workspace = true
bson.workspace = true
kimmy-auth.workspace = true
kimmy-storage.workspace = true
tempfile.workspace = true
serde_norway.workspace = true
jsonschema.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
