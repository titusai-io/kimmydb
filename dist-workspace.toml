[workspace]
members = ["cargo:."]

# Release engineering, generated and driven by `dist` (cargo-dist). See
# ADR-063: pushing a `v*` tag builds both binaries for every target below,
# checksums them, drafts the GitHub Release from CHANGELOG.md, and calls the
# GHCR publish workflow. The Homebrew half of ADR-063 is paused with the macOS
# target it needs (ADR-156), which is what the commented lines below are.
#
# `.github/workflows/release.yml` is GENERATED from this file. Do not edit it
# by hand — change this file and run `dist generate`. The `plan` job that runs
# on every pull request fails if the two have drifted.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Homebrew is paused with the macOS
# build it needs (ADR-156): the tap carries `kimmy` for macOS, and a formula
# generated from a release that built no macOS binary would pin Linux musl
# archives and install nothing a Mac can run, which is worse than publishing
# nothing. crates/kimmyd/Cargo.toml opts the server out with
# `installers = []` either way — the server distributes as the GHCR container
# image (ADR-063).
installers = []
# A GitHub repo to push Homebrew formulas to
# tap = "titusai-io/homebrew-tap"
# Publish jobs to run in CI. `homebrew` is paused with the macOS build
# (ADR-156); put it back at the front of this list when the target returns.
# `./publish-ghcr` is ours:
# .github/workflows/publish-ghcr.yml, the multi-arch container image. dist
# runs publish jobs after `host`, which runs after every build job, so the
# image job can take the Linux archives from the run's own workflow artifacts
# (`artifacts-build-local-<target>`) rather than compiling again (ADR-107).
publish-jobs = ["./publish-ghcr"]
# The Linux builds start from the dependency cache CI writes on main. dist's
# own `cache-builds` stays off: it keys a rust-cache on this workflow's job
# name, and a cache is readable only from the ref that wrote it or from the
# default branch, so a tag could never read what a previous tag wrote and
# would write a gigabyte per release that nothing reads. Instead the steps in
# .github/release-build-setup.yml are inlined into `build-local-artifacts`
# just before `dist build`: they restore, and never save, the cache that the
# `build kimmyd` jobs in ci.yml write from main for the same target under the
# same `shared-key` (ADR-118). Every target that builds now has one; the
# macOS build, which found no cache and ran cold, is paused (ADR-156).
github-build-setup = "../release-build-setup.yml"
# Target platforms to build apps for (Rust target-triple syntax).
#
# musl rather than gnu for Linux, deliberately: the result is a static binary
# that runs on any distribution and in a scratch container, and redb and ring
# both build cleanly against musl on both architectures — verified empirically
# on aarch64 (ADR-063) before this was written down.
# No x86_64-apple-darwin: Intel Macs are not supported (decided 2026-08-28).
# It was also the release's longest build at over twelve minutes — the macOS
# x86_64 runners are the slowest dist offers — for a platform Apple stopped
# selling in 2023.
#
# aarch64-apple-darwin is paused rather than dropped (ADR-156). The container
# image is the only artifact in day-to-day use, and GitHub bills macOS at ten
# times the Linux rate, so that one job was about four fifths of a release's
# billed minutes. The two musl targets stay because the image is built from
# their archives (ADR-107). To bring macOS back: uncomment the line below and
# the four macOS paths in `[[dist.extra-artifacts]]`, restore Homebrew above,
# then run `dist generate`.
targets = [
    # "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]

# Software bills of materials, one per shipped binary per target (ADR-110).
# dist runs the command in the global-artifacts job, after every platform
# build, and uploads each file named below to the Release beside the
# archives. `scripts/sbom.sh` says how the files are produced and why there
# is one per target. The `.sha256` files are the script's too: dist checksums
# only the archives it builds itself, so an extra artifact that wants one has
# to bring its own. The target list is repeated here because this table takes
# literal paths; keep it in step with `targets` above.
[[dist.extra-artifacts]]
build = [
    "scripts/sbom.sh",
    # "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
artifacts = [
    # "target/sbom/kimmyd-aarch64-apple-darwin.cdx.json",
    # "target/sbom/kimmyd-aarch64-apple-darwin.cdx.json.sha256",
    # "target/sbom/kimmy-cli-aarch64-apple-darwin.cdx.json",
    # "target/sbom/kimmy-cli-aarch64-apple-darwin.cdx.json.sha256",
    "target/sbom/kimmyd-aarch64-unknown-linux-musl.cdx.json",
    "target/sbom/kimmyd-aarch64-unknown-linux-musl.cdx.json.sha256",
    "target/sbom/kimmy-cli-aarch64-unknown-linux-musl.cdx.json",
    "target/sbom/kimmy-cli-aarch64-unknown-linux-musl.cdx.json.sha256",
    "target/sbom/kimmyd-x86_64-unknown-linux-musl.cdx.json",
    "target/sbom/kimmyd-x86_64-unknown-linux-musl.cdx.json.sha256",
    "target/sbom/kimmy-cli-x86_64-unknown-linux-musl.cdx.json",
    "target/sbom/kimmy-cli-x86_64-unknown-linux-musl.cdx.json.sha256",
]

# Native runners for both Linux architectures. Without the arm mapping dist
# would cross-compile from x86_64, and ring's C and assembly make a native
# toolchain the path that cannot surprise anyone.
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-musl = "ubuntu-24.04"

# Pushing a multi-arch image needs more than the release workflow's
# `contents: write`. `id-token` and `attestations` are for the build
# provenance attestation on the image manifest (ADR-108): a called workflow's
# job can hold no permission its caller did not grant, and dist writes the
# caller, so the grant has to be made here.
[dist.github-custom-job-permissions]
publish-ghcr = { packages = "write", contents = "read", id-token = "write", attestations = "write" }

# Build provenance for the release archives — dist's `github-attestations`
# adds an `actions/attest` step to `build-local-artifacts` over everything it
# built — stays OFF until the repository is public. GitHub generates
# attestations for a private repository only on an Enterprise Cloud plan; on
# any other plan the step fails, and dist emits it with no condition, so
# enabling it now would fail every release at the attest step. The container
# image's attestation (publish-ghcr.yml) is conditional on visibility and
# needs no such care. At go-public: uncomment, run `dist generate`, commit
# the regenerated release.yml, and the next tag's archives are attested.
# github-attestations = true
